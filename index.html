    styleLine(a) +
    (a.rateHist && a.rateHist.length > 1 ? '<div class="small muted">' + t('Production by period:') + ' ' + a.rateHist.map(r => '<span class="nowrap">' + esc(serverStr(r.from)) + '–' + esc(serverStr(r.to)) + ' <b>' + fCu(Math.max(0, r.g)) + '/h</b></span>').join(' · ') + '</div>' : '') +
    '<div class="small muted">' + t('Last copper reading {c} ({d} server)', { c: fCu(a.copper), d: esc(serverStr(a.copperAt)) }) + ' · ' + t('Production {g}/h ({src}) · economy copper {e}', { g: fCu(a.g), src: src || esc(a.gSrc), e: fCu(a.econ) }) + (a.notes ? ' · ' + esc(a.notes) : '') + '</div></div>';
}

function styleLine(a){
  const s = styleOf(a.tag);
  if (!s) return '<div class="small muted">' + t('Target style: no declarations recorded yet, so the model assumes it chases expected copper.') + '</div>';
  return '<div class="small">' + t('Target style: <b>{s}</b> (lean {l}, from {n} declarations).', { s: styleLbl(s.k), l: fLean(s.lean), n: s.n }) + ' <span class="muted">' + t('Past picks by member power, 1 = weakest option:') + '</span> ' + picksH(s) + '</div>';
}

/* ---------- Declare ---------- */
function renderDeclare(){
  const up = upcoming();
  if (!up.length) return '<section class="panel"><p>' + t('No upcoming rounds.') + '</p></section>';
  if (!S.selRound || !up.find(r => r.n === S.selRound)) S.selRound = up[0].n;
  const r = up.find(x => x.n === S.selRound);
  const st = stepFor(r.n);
  const role = roleOf(r);
  const gi = S.selGroup || st.gIdx;
  const grp = st.groups.byIdx[gi];
  const groupsOpts = st.groups.list.map(g => '<option value="' + g.idx + '"' + (g.idx === gi ? ' selected' : '') + '>' + t('Group {g} · ranks {lo}–{hi}', { g: g.idx, lo: g.range[0], hi: hiS(g.range[1]) }) + (g.idx === st.gIdx ? t(' (ours)') : '') + '</option>').join('');
  let h = '<section class="panel"><div class="panel-h"><div><div class="eyebrow">' + t('Declaration planner') + '</div><h2>' + t('Round {n} · {d} server · {f} attacks', { n: r.n, d: esc(serverStr(r.t, true)), f: esc(fname(r.atk)) }) + '</h2></div>' +
    '<div class="controls"><select id="selRound" aria-label="' + esc(t('Round')) + '">' + up.map(x => '<option value="' + x.n + '"' + (x.n === r.n ? ' selected' : '') + '>' + roundOpt(x) + '</option>').join('') + '</select>' +
    '<select id="selGroup" aria-label="' + esc(t('Group')) + '">' + groupsOpts + '</select></div></div>' +
    '<p class="small muted">' + t('Group membership is projected from copper at {d} server ({when}), including expected results of earlier rounds. Confirm it in-game; record actual declarations below and every number updates.', { d: esc(serverStr(r.lockT, true)), when: M.cfg.lockMode === 'week' ? t('week start') : t('when declarations open') }) + '</p></section>';
  if (needsScen(r)) {
    const sc = scenFor(r.n);
    const prev = M.schedule.filter(x => !x.played && x.t > Date.now() && x.t < r.lockT).slice(-1)[0];
    h += '<section class="panel"><div class="panel-h"><div><div class="eyebrow">' + t('Depends on round {p}', { p: prev.n }) + '</div><h3>' + t('Who we can declare on in round {n} depends on round {p}', { p: prev.n, n: r.n }) + '</h3></div></div>' +
      (sc === undefined ? '<p class="small muted">' + t('Working through round {p} outcomes…', { p: prev.n }) + '</p>' : !sc ? '' : scenTable(sc, false)) +
      '<p class="small muted">' + t('Simulated {k} times: every group’s declarations and results in round {p}, using each alliance’s habits and the measured loot. The percentage next to each target is how often it was our best declaration in that case. The group shown below is the single average projection, which can sit between real outcomes.', { k: sc ? sc.n : 250, p: prev.n }) + '</p></section>';
  }
  if (!grp) return h + '<section class="panel"><p>' + t('Group not found.') + '</p></section>';
  const sim = M.simGroup(r.n, grp, st.cuLock, (fixedByRound()[r.n]) || {});
  const cu = st.cuLock;
  const atkF = r.atk, defF = CW.other(atkF);
  const isOurs = gi === st.gIdx;
  h += '<section class="panel"><div class="panel-h"><h3>' + t('Group {g}: {a} attackers vs {d} defenders', { g: gi, a: esc(fname(atkF)), d: esc(fname(defF)) }) + '</h3></div><div class="matchup"><div class="side">' + grp[atkF].map(x => unitRow(x, cu)).join('') + '</div><div class="vs">→</div><div class="side">' + grp[defF].map(x => unitRow(x, cu, t('max plunder {v}', { v: fCu(cu[x] * M.cfg.plunderPct) }))).join('') + '</div></div></section>';
  if (!sim.A.length || !sim.D.length) return h + '<section class="panel"><p>' + t('This group has no one on the other side, so nobody fights here this round.') + '</p></section>';

  if (role === 'attack' && isOurs && sim.attackers[us()]) {
    const A = sim.attackers[us()];
    const rows = sim.D.map(d => {
      const pairs = sim.A.filter(x => x !== us()).map(p => Object.assign({ p }, A.condPair ? A.condPair[d + '|' + p] : {})).filter(x => x.ev != null).sort((x, y) => y.ev - x.ev);
      return { d, solo: A.solo[d], cond: A.cond[d], condP: A.condP ? A.condP[d] : null, pair: pairs[0], def: M.al[d] };
    }).sort((x, y) => y.cond - x.cond);
    h += '<section class="panel"><div class="panel-h"><div><div class="eyebrow">' + t('Our options') + '</div><h3>' + t('Where {tag} should declare', { tag: tagH(us()) }) + '</h3></div><span class="pill cu">' + t('Best: {tag} {v}', { tag: tagH(rows[0].d), v: fSigned(rows[0].cond) }) + '</span></div>' +
      '<div class="tbl-wrap"><table><thead><tr><th>' + t('Target') + '</th><th class="n">' + t('Copper') + '</th><th class="n">' + t('Max plunder') + '</th><th>' + t('Their defense') + '</th><th class="n">' + t('Win 1v1') + '</th><th class="n">' + t('Win, likely pile-ups') + '</th><th class="n">' + t('Expected for us') + '</th><th>' + t('Best pairing') + '</th></tr></thead><tbody>' +
      rows.map((x, i) => '<tr' + (i === 0 ? ' class="us-row"' : '') + '><td>' + tagH(x.d) + '</td><td class="n mono">' + fCu(cu[x.d]) + '</td><td class="n mono">' + fCu(cu[x.d] * M.cfg.plunderPct) + '</td><td>' + x.def.defW + '–' + x.def.defL + ' ' + beatH(beatStats(x.def.beatDef)) + '</td><td class="n">' + fPct(x.solo.P) + '</td><td class="n">' + fPct(x.condP) + '</td><td class="n mono"><b>' + fSigned(x.cond) + '</b></td><td>' + (x.pair ? t('with {tag}: win {w}, our share {s}, {v}', { tag: tagH(x.pair.p), w: fPct(x.pair.P), s: fPct(x.pair.share), v: fSigned(x.pair.ev) }) : '—') + '</td></tr>').join('') +
      '</tbody></table></div><p class="small muted">' + t('“Expected for us” = chance of winning × our share of the plunder, plus warehouse copper we usually take even when the center holds. A pairing means a faction-mate declares on the same target; the defender may then invite a free alliance from their side to assist (assumed {p} likely).', { p: fPct(M.cfg.assistProb) }) + '</p></section>';
    if (sim.plans && sim.plans.length) {
      const byUs = sim.plans.slice().sort((x, y) => (y.ev[us()] || 0) - (x.ev[us()] || 0) || y.total - x.total).slice(0, 3);
      const byTot = sim.plans.slice().sort((x, y) => y.total - x.total).slice(0, 3);
      const planRow = p => '<tr><td>' + sim.A.map(a => tagH(a) + ' → ' + tagH(p.choice[a])).join('<br>') + '</td><td>' + Object.keys(p.res).map(d => tagH(d) + ' ' + fPct(p.res[d].P) + (p.res[d].assists.length ? ' <span class="small muted">' + t('(+{x} assist)', { x: p.res[d].assists.join(', ') }) + '</span>' : '')).join('<br>') + '</td><td class="n mono">' + fSigned(p.ev[us()] || 0) + '</td><td class="n mono">' + fSigned(p.total) + '</td></tr>';
      const planHead = '<thead><tr><th>' + t('Declarations') + '</th><th>' + t('Win chance') + '</th><th class="n">' + t('Us') + '</th><th class="n">' + t('Our side') + '</th></tr></thead>';
      h += '<section class="panel"><div class="panel-h"><div><div class="eyebrow">' + t('Coordinate with faction-mates') + '</div><h3>' + t('Group plans') + '</h3></div></div><div class="grid2">' +
        '<div><div class="small muted" style="margin-bottom:6px">' + t('Best for us') + '</div><div class="tbl-wrap"><table>' + planHead + '<tbody>' + byUs.map(planRow).join('') + '</tbody></table></div></div>' +
        '<div><div class="small muted" style="margin-bottom:6px">' + t('Best for our whole side') + '</div><div class="tbl-wrap"><table>' + planHead + '<tbody>' + byTot.map(planRow).join('') + '</tbody></table></div></div>' +
        '</div><p class="small muted">' + t('Spreading out keeps every enemy busy defending, so nobody is free to assist. Doubling up on one target frees an enemy to help defend it.') + '</p></section>';
    }
  }
  if (role === 'defend' && isOurs && sim.defenders[us()]) {
    const o = sim.defenders[us()];
    const L = M.loot(cu, us());
    const sc = aggScen(o.scen).slice(0, 5);
    h += '<section class="panel"><div class="panel-h"><div><div class="eyebrow">' + t('Our defense') + '</div><h3>' + t('Who is likely to hit {tag}', { tag: tagH(us()) }) + '</h3></div><span class="pill warn">' + t('expected {v}', { v: fCu(-o.expLoss) }) + '</span></div>' +
      '<div class="tbl-wrap"><table><thead><tr><th>' + t('Enemy') + '</th><th>' + t('Target style') + '</th>' + sim.D.map(d => '<th class="n">' + t('Picks {x}', { x: esc(d) }) + '</th>').join('') + '<th class="n">' + t('Beats us 1v1') + '</th><th>' + t('Their attack record') + '</th></tr></thead><tbody>' +
      sim.A.map(e => { const a = M.al[e]; return '<tr><td>' + tagH(e) + '</td><td>' + styleH(e) + '</td>' + sim.D.map(d => '<td class="n' + (d === us() ? '' : ' muted') + '">' + fPct(sim.attackers[e].probs[d] || 0) + '</td>').join('') + '<td class="n">' + fPct(M.pwin([e], [us()])) + '</td><td>' + a.atkW + '–' + a.atkL + ' ' + beatH(beatStats(a.beatAtk)) + '</td></tr>'; }).join('') +
      '</tbody></table></div>' +
      '<div class="grid2"><div><div class="small muted" style="margin-bottom:6px">' + t('Most likely attacks on us') + '</div><div class="tbl-wrap"><table><thead><tr><th>' + t('Attackers') + '</th><th>' + t('Our assist') + '</th><th class="n">' + t('Chance') + '</th><th class="n">' + t('They win') + '</th></tr></thead><tbody>' +
      (sc.length ? sc.map(s => '<tr><td>' + s.attackers.map(x => tagH(x)).join(' + ') + '</td><td>' + (s.assists.length ? s.assists.map(x => tagH(x)).join(', ') : '<span class="muted">' + t('none allowed') + '</span>') + '</td><td class="n">' + fPct(s.p) + '</td><td class="n">' + fPct(s.P) + '</td></tr>').join('') : '<tr><td colspan="4" class="muted">' + t('Nobody is expected to declare on us.') + '</td></tr>') +
      '</tbody></table></div></div><div><dl class="kv"><dt>' + t('Declared on at all') + '</dt><dd>' + fPct(o.pAttacked) + '</dd></dl>' + outcomeKv(o.pAttacked ? o.pLose / o.pAttacked : 0, cu, us()) +
      '<p class="small muted" style="margin-top:8px">' + t('With 2 attackers we may invite 1 assist; with 3, up to 2. Only group-mates nobody declared on can help, and assists never lose copper.') + '</p></div></div></section>';
  }
  h += '<section class="panel"><div class="panel-h"><h3>' + t('Every defender in this group') + '</h3></div><div class="tbl-wrap"><table><thead><tr><th>' + t('Defender') + '</th><th class="n">' + t('Declared on') + '</th><th class="n">' + t('Falls, if declared on') + '</th><th class="n">' + t('Expected loss') + '</th><th>' + t('Their defense') + '</th></tr></thead><tbody>' +
    sim.D.map(d => { const o = sim.defenders[d], a = M.al[d]; return '<tr' + (d === us() ? ' class="us-row"' : '') + '><td>' + tagH(d) + '</td><td class="n">' + fPct(o.pAttacked) + '</td><td class="n">' + fPct(o.pAttacked ? o.pLose / o.pAttacked : 0) + '</td><td class="n mono">' + fCu(-o.expLoss) + '</td><td>' + a.defW + '–' + a.defL + ' ' + beatH(beatStats(a.beatDef)) + '</td></tr>'; }).join('') + '</tbody></table></div>' + (sim.exact ? '' : '<p class="small muted">' + t('Large group: estimates treat each attacker’s choice independently.') + '</p>') + '</section>';
  const fx = (fixedByRound()[r.n]) || {};
  h += '<section class="panel"><div class="panel-h"><div><div class="eyebrow">' + t('Declaration Record') + '</div><h3>' + t('Record who declared on whom') + '</h3></div>' + (S.canWrite ? '' : '<span class="small muted">' + t('View only') + '</span>') + '</div>' +
    '<p class="small muted">' + t('Leave “Model guess” until you see a real declaration in-game. Locked choices replace the guesses for this round everywhere in the tool.') + '</p><div class="form-grid">' +
    sim.A.map(a => '<label class="f">' + t('{tag} declares on', { tag: esc(a) }) + '<select data-fix="' + esc(a) + '" data-round="' + r.n + '"' + (S.canWrite ? '' : ' disabled') + '><option value="">' + t('Model guess') + '</option>' + sim.D.map(d => '<option value="' + esc(d) + '"' + (fx[a] === d ? ' selected' : '') + '>' + esc(d) + '</option>').join('') + '<option value="none"' + (fx[a] === 'none' ? ' selected' : '') + '>' + t('No declaration') + '</option></select></label>').join('') + '</div></section>';
  return h;
}

/* ---------- Strategy ---------- */
function renderStrategy(){
  const up = upcoming();
  const nd = up.find(r => roleOf(r) === 'defend');
  const na = up.find(r => roleOf(r) === 'attack');
  let h = '';
  if (nd && !up.some(x => x.n > nd.n)) {
    h += '<section class="panel"><div class="panel-h"><div><div class="eyebrow">' + t('Tanking') + '</div><h2>' + t('No reason to tank round {n}', { n: nd.n }) + '</h2></div></div><p class="verdict">' + t('Round {n} is the last round, so losing on purpose can’t buy an easier group later. It would only hand over copper. Fight every defense.', { n: nd.n }) + '</p></section>';
  } else if (nd) {
    const pols = [['fight', 'Declared on, we fight'], ['fold', 'Declared on, we lose on purpose'], ['hold', 'Declared on, we hold the center'], ['spared', 'Nobody declares on us']];
    const res = pols.map(([k, l]) => ({ k, l, f: forecast({ [nd.n]: k }) }));
    const fight = res[0].f, fold = res[1].f;
    const d = fold.end[us()] - fight.end[us()];
    h += '<section class="panel"><div class="panel-h"><div><div class="eyebrow">' + t('Tanking') + '</div><h2>' + t('Should we lose round {n} on purpose?', { n: nd.n }) + '</h2></div><span class="pill ' + (d > 0 ? 'good' : 'warn') + '">' + (d > 0 ? t('Folding pays {v}', { v: fCu(d) }) : t('Fighting pays {v}', { v: fCu(-d) })) + '</span></div>' +
      '<p class="verdict">' + t('Losing a defense hands the attacker about {v} and drops us down the {f} ranking, into a group with weaker enemies for the rounds after.', { v: fCu(M.loot(stepFor(nd.n).cuLock, us()).win), f: esc(fname(ourF())) }) + ' ' + (d > 0 ? t('<b>Right now the easier groups are worth more than the copper it costs.</b>') : t('<b>Right now the copper we would give away is worth more than the easier groups it buys.</b>')) + ' ' + t('The table follows us through every remaining round.') + '</p>' +
      '<div class="tbl-wrap"><table><thead><tr><th class="stick">' + t('Scenario') + '</th><th class="n">' + t('End copper') + '</th><th class="n">' + t('End rank') + '</th>' + fight.steps.map(s => '<th>R' + s.round.n + ' · ' + weRole(roleOf(s.round)) + '</th>').join('') + '</tr></thead><tbody>' +
      res.map(x => '<tr' + (x.k === 'fight' ? ' class="us-row"' : '') + '><td class="stick">' + esc(t(x.l)) + '</td><td class="n mono"><b>' + fCu(x.f.end[us()]) + '</b></td><td class="n">#' + x.f.endFrank + '</td>' + x.f.steps.map(s => '<td><span class="mono">' + fSigned(s.usDelta) + '</span><br><span class="small muted">grp ' + (s.gIdx || '—') + ' (#' + (s.frankLock || '—') + ') vs ' + (s.sim ? s.sim[s.sim.atkF === ourF() ? 'D' : 'A'].map(esc).join(', ') : '—') + '</span></td>').join('') + '</tr>').join('') +
      '</tbody></table></div><p class="small muted">' + t('Every alliance’s copper moves by its expected result each round, so group projections are central estimates. “Lose on purpose” only works if someone actually declares on us.') + '</p></section>';
    const later = up.filter(r => r.week > nd.week);
    const atkR = later.find(r => roleOf(r) === 'attack'), defR = later.find(r => roleOf(r) === 'defend');
    if (atkR || defR) {
      const base = (fight.steps.find(s => s.round.n === (atkR || defR).n) || {}).cuLock;
      if (base) {
        const key = 'bands' + (atkR ? atkR.n : 0) + (defR ? defR.n : 0);
        const bands = memo[key] || (memo[key] = M.bandValues(atkR ? atkR.n : null, defR ? defR.n : null, base));
        const fightBand = (fight.steps.find(s => s.round.n === (atkR || defR).n) || {}).gIdx;
        const foldBand = (fold.steps.find(s => s.round.n === (atkR || defR).n) || {}).gIdx;
        const desc = atkR && defR ? t('Expected copper from our attack in round {a} minus our expected loss defending in round {d}, if we sat in each {f} rank band. Taller is better.', { a: atkR.n, d: defR.n, f: esc(fname(ourF())) })
          : atkR ? t('Expected copper from our attack in round {a}, if we sat in each {f} rank band. Taller is better.', { a: atkR.n, f: esc(fname(ourF())) })
          : t('Expected copper from our defense in round {d}, if we sat in each {f} rank band. Taller is better.', { d: defR.n, f: esc(fname(ourF())) });
        h += '<section class="panel"><div class="panel-h"><div><div class="eyebrow">' + t('Week {w} · rounds {r}', { w: (atkR || defR).week, r: [atkR, defR].filter(Boolean).map(r => r.n).join(' & ') }) + '</div><h2>' + t('What each rank band is worth to us') + '</h2></div></div>' +
          '<p class="small muted">' + desc + '</p>' +
          bandChart(bands, fightBand, foldBand) +
          '<details><summary>' + t('Table view') + '</summary><div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>' + t('Band') + '</th><th>' + t('Enemies') + '</th><th class="n">' + t('Our copper there') + '</th><th class="n">' + t('Attack') + '</th><th class="n">' + t('Defense') + '</th><th class="n">' + t('Net') + '</th></tr></thead><tbody>' +
          bands.map(b => '<tr' + (b.band === fightBand ? ' class="us-row"' : '') + '><td>' + b.lo + '–' + hiS(b.hi) + '</td><td>' + b.enemies.slice(0, 4).map(x => tagH(x)).join(' ') + (b.enemies.length > 4 ? ' +' + (b.enemies.length - 4) : '') + '</td><td class="n mono">' + fCu(b.cuLevel) + '</td><td class="n mono">' + fSigned(b.atkEV) + '</td><td class="n mono">' + fCu(-b.defLoss) + '</td><td class="n mono"><b>' + fSigned(b.value) + '</b></td></tr>').join('') +
          '</tbody></table></div></details></section>';
      }
    }
  }
  if (na) {
    const st = stepFor(na.n);
    if (st && st.sim && st.sim.attackers[us()]) {
      const sim = st.sim, A = sim.attackers[us()];
      const mates = sim.A.filter(x => x !== us());
      let bestSolo = -Infinity, bestPair = { ev: -Infinity };
      for (const d of sim.D) { bestSolo = Math.max(bestSolo, A.cond[d]); for (const p of mates) { const c = A.condPair && A.condPair[d + '|' + p]; if (c && c.ev > bestPair.ev) bestPair = Object.assign({ d, p }, c); } }
      const pairUp = bestPair.ev > bestSolo;
      h += '<section class="panel"><div class="panel-h"><div><div class="eyebrow">' + t('Round {n} · double declarations', { n: na.n }) + '</div><h2>' + t('Is a 2v2 ever worth it?') + '</h2></div><span class="pill ' + (pairUp ? 'good' : 'warn') + '">' + (pairUp ? t('Pair up') : t('Go solo')) + '</span></div>' +
        '<p class="verdict">' + (pairUp ? t('Pairing with {p} on {d} is worth {v} to us vs {s} for our best solo declaration.', { p: tagH(bestPair.p), d: tagH(bestPair.d), v: fSigned(bestPair.ev), s: fSigned(bestSolo) })
          : t('Our best solo declaration ({s}) beats our best pairing ({pair}). A second attacker raises the odds a little, but the loot splits by damage and the defender gets to invite a free ally.', { s: fSigned(bestSolo), pair: isFinite(bestPair.ev) ? t('{v}, with {p} on {d}', { v: fSigned(bestPair.ev), p: tagH(bestPair.p), d: tagH(bestPair.d) }) : t('none available') })) + '</p>' +
        '<div class="tbl-wrap"><table><thead><tr><th>' + t('Target') + '</th><th class="n">' + t('Solo') + '</th>' + mates.map(p => '<th class="n">' + t('With {p}', { p: esc(p) }) + '</th>').join('') + '</tr></thead><tbody>' +
        sim.D.map(d => '<tr><td>' + tagH(d) + '</td><td class="n"><span class="mono">' + fSigned(A.cond[d]) + '</span><br><span class="small muted">' + t('win {w}', { w: fPct(A.condP ? A.condP[d] : null) }) + '</span></td>' + mates.map(p => { const c = A.condPair && A.condPair[d + '|' + p]; return '<td class="n">' + (c ? '<span class="mono">' + fSigned(c.ev) + '</span><br><span class="small muted">' + t('win {w} · share {s}', { w: fPct(c.P), s: fPct(c.share) }) + '</span>' : '—') + '</td>'; }).join('') + '</tr>').join('') +
        '</tbody></table></div><p class="small muted">' + t('When it can flip: a target far stronger than any one of us, rich enough that half the plunder still beats a solo hit elsewhere, and no free enemy left to assist it (every other enemy in the group already declared on).') + '</p></section>';
    }
  }
  h += habitsPanel();
  const soft = M.battles.filter(b => b.winner === 'A' && b.pAtk < 0.35);
  const held = M.battles.filter(b => b.winner === 'D' && b.pAtk > 0.75);
  h += '<section class="panel"><div class="panel-h"><div><div class="eyebrow">' + t('Possible tanking by others') + '</div><h3>' + t('Defenses that fell when they should have held') + '</h3></div></div>' +

/* phone layout: label every cell from its column header so tables can stack as cards */
function cardify(){
  document.querySelectorAll('#main .tbl-wrap > table').forEach(tbl => {
    if (tbl.classList.contains('keep')) return;
    const heads = [];
    const hr = tbl.tHead && tbl.tHead.rows[0];
    if (hr) for (const th of hr.cells) { const tx = th.textContent.replace(/[▲▼]/g, '').trim(); for (let k = 0; k < (th.colSpan || 1); k++) heads.push(tx); }
    const primary = hr ? [...hr.cells].findIndex(th => th.classList.contains('stick')) : -1;
    for (const tb of tbl.tBodies) for (const tr of tb.rows) {
      let idx = 0; let titled = false;
      [...tr.cells].forEach((td, i) => {
        const span = td.colSpan || 1;
        const txt = td.textContent.trim();
        if (span > 1) { td.classList.add('full'); td.removeAttribute('data-label'); }
        else {
          const lab = heads[idx] || '';
          if (lab) td.setAttribute('data-label', lab);
          const isTitle = !titled && (primary >= 0 ? idx === primary : i === 0);
          if (isTitle) { td.classList.add('cardh'); titled = true; }
          else if (txt.length > 24 || td.querySelector('br')) td.classList.add('full');
          if (!txt && !td.querySelector('button,select,input,svg,.pip')) td.classList.add('blank');
        }
        idx += span;
      });
    }
    tbl.classList.add('cards');
    tbl.parentElement.classList.add('has-cards');
  });
}
function saveTab(){ try { localStorage.setItem('qiet.tab', S.tab); } catch (e) {} }
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { S.tab = b.dataset.tab; saveTab(); render(); }));

/* ---------- writes ---------- */
async function guard(fn, okMsg){
  if (!S.db) { toast(t('The shared record is not connected in this view')); return; }
  try { await fn(); if (okMsg) toast(okMsg); }
  catch (e) { console.error(e); toast(e && e.code === 'invalid_argument' ? t('You have view-only access here') : t('Could not save: {m}', { m: (e && (e.message || e.code)) || t('unknown error') })); if (e && e.code === 'invalid_argument') { S.canWrite = false; render(); } }
}
function readSide(prefix, cuPrefix, n){ const out = []; for (let i = 0; i < n; i++) { const tg = ($('#' + prefix + i) || {}).value; if (!tg || !tg.trim()) continue; const c = cuPrefix ? parseCu(($('#' + cuPrefix + i) || {}).value || '0') : 0; out.push({ tag: tg.trim().replace(/^\[|\]$/g, ''), cu: isFinite(c) ? c : 0 }); } return out; }
function saveBattle(){
  const round = +$('#bRound').value, winner = $('#bWin').value;
  const attackers = readSide('bA', 'bAc', 3);
  const d0 = readSide('bD', 'bDc', 1); const assists = readSide('bD', null, 3).slice(1).map(x => ({ tag: x.tag, cu: 0 }));
  if (!attackers.length || !d0.length) { toast(t('Add at least one attacker and the defender')); return; }
  const defenders = d0.concat(assists);
  const r = (M ? M.cfg.rounds : CW.DEFAULT_CFG.rounds).find(x => x.n === round);
  let id = S.editBattle;
  if (!id) { const used = new Set(S.battles.map(b => b.id)); let k = S.battles.filter(b => b.round === round).length + 1; do { id = 'r' + round + '-' + String(k).padStart(2, '0'); k++; } while (used.has(id)); }
  const doc = { id, round, date: r ? r.date : '', atkFaction: r ? r.atk : '', attackers, defenders, winner, note: ($('#bNote').value || '').trim(), updatedAt: new Date().toISOString() };
  const wasEdit = !!S.editBattle;
  guard(async () => { await S.db.doc('battles/' + id).set(doc); S.editBattle = null; }, wasEdit ? t('Battle saved') : t('Battle added'));
}
function delBattle(id, btn){
  if (btn.dataset.armed !== '1') { btn.dataset.armed = '1'; btn.textContent = t('Tap again to delete'); setTimeout(() => { if (btn.isConnected) { btn.dataset.armed = ''; btn.textContent = t('Delete'); } }, 3000); return; }
  guard(() => S.db.doc('battles/' + id).delete(), t('Battle deleted'));
}
function factionOfZone(z){ const c = M ? M.cfg : CW.DEFAULT_CFG; if (c.factions.red.zones.includes(+z)) return 'red'; if (c.factions.blue.zones.includes(+z)) return 'blue'; return null; }
async function upsertAlliance(tag, patch){
  const ex = S.alliances.find(a => a.tag === tag);
  const now = new Date().toISOString();
  if (patch.copper != null) { const hist = ((ex && ex.hist) || []).slice(-11); hist.push({ at: now, cu: patch.copper, exact: true }); patch.hist = hist; patch.copperAt = now; }
  if (patch.power != null) patch.powerAt = now;
  if (ex) await S.db.doc('alliances/' + tag).update(patch);
  else { if (!patch.faction) throw { message: t('New alliance {t} needs a warzone', { t: tag }) }; await S.db.doc('alliances/' + tag).set(Object.assign({ tag, name: tag }, patch)); }
}
function saveAlliance(){
  const tag = ($('#aTag').value || '').trim().replace(/^\[|\]$/g, ''); if (!tag) { toast(t('Pick an alliance')); return; }
  const patch = {};
  const cu = parseCu($('#aCu').value); if (isFinite(cu)) patch.copper = cu;
  const pwS = ($('#aPw').value || '').trim(); if (pwS) { const m = pwS.match(/([\d.]+)\s*([gGmM]?)/); if (m) patch.power = /m/i.test(m[2]) ? parseFloat(m[1]) / 1000 : parseFloat(m[1]); }
  const g = parseCu($('#aG').value); if (isFinite(g)) patch.growth = g;
  const z = ($('#aZone').value || '').trim(); if (z) { patch.warzone = +z; const f = factionOfZone(z); if (f) patch.faction = f; }
  patch.inactive = $('#aInactive').value === '1';
  patch.notes = ($('#aNotes').value || '').trim();
  guard(async () => { await upsertAlliance(tag, patch); }, t('Saved [{t}]', { t: tag }));
}
async function bulkUpdate(){
  const txt = $('#bulk').value || ''; const msg = $('#bulkMsg');
  const lines = txt.split(/\n+/).map(l => l.trim()).filter(Boolean);
  const parsed = [];
  for (const l of lines) {
    const tm = l.match(/\[([^\]]{1,12})\]/); if (!tm) continue;
    const tag = tm[1].trim();
    const zm = l.match(/#\s?(\d{4})/);
    const pm = l.match(/(?:Power|Poder):?\s*([\d.]+)\s*([GM])/i);
    let rest = l.replace(tm[0], ' ').replace(/#\s?\d{4}/, ' ').replace(/(?:Power|Poder):?\s*[\d.]+\s*[GM]/i, ' ');
    const nums = (rest.match(/\d[\d,]*(?:\.\d+)?\s*[KkMm]?\b/g) || []).map(parseCu).filter(n => isFinite(n) && n >= 1000);
    const cu = nums.length ? Math.max(...nums) : null;
    parsed.push({ tag, cu, zone: zm ? +zm[1] : null, power: pm ? (/m/i.test(pm[2]) ? parseFloat(pm[1]) / 1000 : parseFloat(pm[1])) : null });
  }
  if (!parsed.length) { msg.textContent = t('No lines with a [TAG] found.'); return; }
  let ok = 0; const skip = [];
  await guard(async () => {
    for (const p of parsed) {
      const patch = {};
      if (p.cu != null) patch.copper = p.cu;
      if (p.power != null) patch.power = p.power;
      if (p.zone) { patch.warzone = p.zone; const f = factionOfZone(p.zone); if (f) patch.faction = f; }
      const exists = S.alliances.some(a => a.tag === p.tag);
      if (!exists && !patch.faction) { skip.push(p.tag); continue; }
      if (!Object.keys(patch).length) continue;
      await upsertAlliance(p.tag, patch); ok++;
    }
  });
  msg.textContent = (ok === 1 ? t('Updated 1 alliance') : t('Updated {n} alliances', { n: ok })) + (skip.length ? t('. Skipped (no warzone, not on file): {x}', { x: skip.join(', ') }) : '.');
}
function saveSettings(){
  const c = Object.assign({}, S.cfg || {});
  c.us = ($('#sUs').value || 'QIET').trim().replace(/^\[|\]$/g, '');
  c.plunderPct = (+$('#sPl').value || 15) / 100;
  c.lootAuto = $('#sLa').value !== 'manual';
  if (!c.lootAuto) { c.winTake = (+$('#sWt').value || 93) / 100; c.lossTake = (+$('#sLt').value || 0) / 100; }
  c.assistProb = Math.max(0, Math.min(1, (+$('#sAp').value || 0) / 100));
  c.lockMode = $('#sLock').value;
  c.serverUtcOffset = +$('#sOff').value || 0;
  const rate = parseCu($('#sRate').value); c.knownRates = Object.assign({}, (S.cfg && S.cfg.knownRates) || {}); if (isFinite(rate) && rate > 0) c.knownRates[c.us] = rate;
  guard(() => S.db.doc('config/main').set(c), t('Settings saved'));
}
function saveFactionTotals(){
  const red = parseCu($('#fRed').value), blue = parseCu($('#fBlue').value);
  if (!isFinite(red) || !isFinite(blue) || red <= 0 || blue <= 0) { toast(t('Enter both faction totals')); return; }
  const c = Object.assign({}, S.cfg || {});
  c.factionTotals = ((S.cfg && S.cfg.factionTotals) || []).slice(-9).concat([{ at: new Date().toISOString(), red, blue }]);
  guard(() => S.db.doc('config/main').set(c), t('Faction totals saved'));
}
function saveFix(round, attacker, target){
  const id = 'r' + round;
  const cur = S.plans[id] || { round, fixed: {} };
  const fixed = Object.assign({}, cur.fixed || {});
  if (target) fixed[attacker] = target; else delete fixed[attacker];
  guard(() => S.db.doc('plans/' + id).set({ round, fixed, updatedAt: new Date().toISOString() }), target ? t('Locked {a} → {t}', { a: attacker, t: target === 'none' ? t('no declaration') : target }) : t('Back to model guess'));
}
function exportJSON(){
  const data = JSON.stringify({ exportedAt: new Date().toISOString(), config: S.cfg, alliances: S.alliances, battles: S.battles, plans: S.plans }, null, 1);
  const box = $('#exportBox');
  const fallback = () => { box.hidden = false; box.value = data; box.focus(); box.select(); toast(t('Select all and copy')); };
  try { navigator.clipboard.writeText(data).then(() => toast(t('Copied {n} KB of JSON', { n: Math.round(data.length / 1024) })), fallback); } catch (e) { fallback(); }
}

/* ---------- boot ---------- */
let rt = null;
function schedule(){ clearTimeout(rt); rt = setTimeout(() => { recompute(); render(); }, 60); }
applyStatic();
render();
setInterval(() => { if (M) renderTop(); }, 60000);
(async function boot(){
  if (!window.claude || !window.claude.use) { S.dbState = 'none'; S.got = { al: true, b: true, cfg: true }; render(); return; }
  const db = await window.claude.use('db');
  if (!db) { S.dbState = 'none'; S.got = { al: true, b: true, cfg: true }; render(); return; }
  S.db = db; S.dbState = 'ok';
  const user = await window.claude.use('user');
  try { const cw = user && user.can ? await user.can('data.write') : null; S.canWrite = cw !== false; } catch (e) { S.canWrite = true; }
  const onErr = e => { console.warn('db', e); };
  db.collection('alliances').onSnapshot(s => { S.alliances = s.docs.map(d => Object.assign({ tag: d.id }, d.data())); S.got.al = true; schedule(); }, onErr);
  db.collection('battles').onSnapshot(s => { S.battles = s.docs.map(d => Object.assign({ id: d.id }, d.data())); S.got.b = true; schedule(); }, onErr);
  db.doc('config/main').onSnapshot(s => { S.cfg = s.exists ? s.data() : null; S.got.cfg = true; schedule(); }, onErr);
  db.collection('plans').onSnapshot(s => { S.plans = {}; s.docs.forEach(d => { S.plans[d.id] = d.data(); }); schedule(); }, onErr);
})();
})();
</script>
