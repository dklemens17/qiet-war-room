  const subs = new Set();

  const clone = o => JSON.parse(JSON.stringify(o));
  function readOverlay() { try { const o = JSON.parse(localStorage.getItem(KEY) || 'null'); return o && o.stamp === stamp ? (o.docs || {}) : {}; } catch (e) { return {}; } }
  function writeOverlay() { try { localStorage.setItem(KEY, JSON.stringify({ stamp, docs: overlay })); } catch (e) {} }
  function edits() { return Object.keys(overlay).length; }

  function ingest(s) {
    snap = s || { alliances: [], battles: [], config: null, plans: {} };
    stamp = String(snap.exportedAt || 'embedded');
    base = {};
    for (const a of snap.alliances || []) if (a && a.tag) base['alliances/' + a.tag] = a;
    for (const b of snap.battles || []) if (b && b.id) base['battles/' + b.id] = b;
    if (snap.config) base['config/main'] = snap.config;
    const p = snap.plans || {};
    if (Array.isArray(p)) p.forEach((x, i) => { base['plans/' + (x.id || ('r' + x.round) || i)] = x; });
    else for (const k of Object.keys(p)) base['plans/' + k] = p[k];
    overlay = readOverlay();
  }
  function get(path) { if (Object.prototype.hasOwnProperty.call(overlay, path)) return overlay[path]; return base[path] || null; }
  function list(col) {
    const ids = new Set();
    for (const k of Object.keys(base)) if (k.startsWith(col + '/')) ids.add(k.slice(col.length + 1));
    for (const k of Object.keys(overlay)) if (k.startsWith(col + '/')) ids.add(k.slice(col.length + 1));

  }

      path: col,
      doc: id => docRef(col + '/' + id),
      onSnapshot(cb) { const s = { col, cb }; subs.add(s); setTimeout(() => fire(), 0); return () => subs.delete(s); }

  function fmtDate(s) { const t = Date.parse(s); if (!isFinite(t)) return 'the last update'; try { return new Date(t).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); } catch (e) { return new Date(t).toISOString().slice(0, 16); } }
  function note() {
    const el = document.getElementById('modeNote'); if (!el) return;
    const n = edits();
    el.hidden = false; el.textContent = '';
    const span = document.createElement('span');

<script>
/* Copper Conquest analysis engine — pure functions, no DOM. */
(function (G) {
  'use strict';
  const HOUR = 3600e3;
  const DEFAULT_CFG = {
    us: 'QIET',
    serverUtcOffset: -2,
    battleTime: '12:30',
    declLeadHours: 36.5,
    week1Start: '2026-09-28',
    weekSizes: { 1: 10, 2: 6, 3: 3, 4: 3 },
    poolFrom: 31,
    lockMode: 'decl',
    plunderPct: 0.15,
    winTake: 0.93,
    lossTake: 0.13,
    assistProb: 0.6,
    choiceTemp: 30000,
    knownRates: { QIET: 2800 },
    model: { auto: true, beta: 800, gamma: 200, H: 30, K: 180 },
    factions: {
      red: { name: 'Kage no Sato', zones: [1596, 1600, 1615, 1629] },
      blue: { name: 'Koubutai', zones: [1593, 1601, 1605, 1632] }
    },
    rounds: [
      { n: 1, date: '2026-09-30', atk: 'red' },
      { n: 2, date: '2026-10-03', atk: 'blue' },
      { n: 3, date: '2026-10-07', atk: 'blue' },
      { n: 4, date: '2026-10-10', atk: 'red' },
      { n: 5, date: '2026-10-14', atk: 'blue' },
      { n: 6, date: '2026-10-17', atk: 'red' },
      { n: 7, date: '2026-10-21', atk: 'red' },
      { n: 8, date: '2026-10-24', atk: 'blue' }
    ]
  };

  const other = f => (f === 'red' ? 'blue' : 'red');
  const sum = a => a.reduce((s, x) => s + x, 0);
  const median = a => { const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length ? (s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2) : 0; };
  const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));

  function mergeCfg(c) {
    const out = JSON.parse(JSON.stringify(DEFAULT_CFG));
    if (!c) return out;
    for (const k of Object.keys(c)) {
      if (c[k] && typeof c[k] === 'object' && !Array.isArray(c[k]) && out[k] && typeof out[k] === 'object' && !Array.isArray(out[k])) out[k] = Object.assign(out[k], c[k]);
      else if (c[k] !== undefined && c[k] !== null) out[k] = c[k];
    }
    return out;
  }

  // server-time helpers: a "server date" string + hh:mm → UTC ms
  function serverToUtc(cfg, dateStr, hhmm) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const [hh, mm] = (hhmm || '00:00').split(':').map(Number);
    return Date.UTC(y, m - 1, d, hh, mm) - cfg.serverUtcOffset * HOUR;
  }

  function build(rawAlliances, rawBattles, rawCfg, opts) {
    opts = opts || {};
    const cfg = mergeCfg(rawCfg);
    const now = opts.now || Date.now();
    const al = {};
    for (const a of rawAlliances) {
      if (!a || !a.tag) continue;
      al[a.tag] = Object.assign({}, a, {
        faction: a.faction || (cfg.factions.red.zones.includes(+a.warzone) ? 'red' : 'blue'),
        copper: +a.copper || 0,
        copperAt: a.copperAt ? Date.parse(a.copperAt) : now,
        hist: Array.isArray(a.hist) ? a.hist.map(h => ({ at: Date.parse(h.at), cu: +h.cu, exact: h.exact !== false })).filter(h => isFinite(h.at)) : []
      });
    }
    // battles
    const roundsByN = {};
    cfg.rounds.forEach(r => { roundsByN[r.n] = r; });
    const battles = rawBattles.filter(b => b && !b.deleted && Array.isArray(b.attackers) && Array.isArray(b.defenders) && b.attackers.length && b.defenders.length)
      .map(b => {
        const r = roundsByN[b.round];
        const date = b.date || (r && r.date);
        return Object.assign({}, b, { date, t: date ? serverToUtc(cfg, date, cfg.battleTime) : 0 });
      })
      .sort((x, y) => x.round - y.round || String(x.id).localeCompare(String(y.id)));
    // make sure every tag in battles exists
    for (const b of battles) for (const p of b.attackers.concat(b.defenders)) {
      if (!al[p.tag]) al[p.tag] = { tag: p.tag, name: p.tag, faction: b.atkFaction ? (b.attackers.includes(p) ? b.atkFaction : other(b.atkFaction)) : 'red', copper: 0, copperAt: now, hist: [], unknown: true };
    }
    const tags = Object.keys(al);
    // net battle copper + econ
    for (const t of tags) { al[t].net = 0; }
    for (const b of battles) {
      for (const p of b.defenders) al[p.tag].net -= (+p.cu || 0);
      for (const p of b.attackers) al[p.tag].net += (+p.cu || 0);
    }
    for (const t of tags) al[t].econ = Math.max(al[t].copper - al[t].net, 1000);

    // ranks (overall and faction), excluding inactive
    const active = tags.filter(t => !al[t].inactive && !al[t].unknown);
    const overall = [...active].sort((a, b) => al[b].copper - al[a].copper);
    overall.forEach((t, i) => { al[t].rank = i + 1; });
    for (const f of ['red', 'blue']) {
      active.filter(t => al[t].faction === f).sort((a, b) => al[b].copper - al[a].copper).forEach((t, i) => { al[t].frank = i + 1; });
    }

    // power: known or imputed from econ (log-log regression)
    const known = tags.filter(t => +al[t].power > 0);
    let pb0 = -9.41, pb1 = 0.845;
    if (known.length >= 5) {
      const xs = known.map(t => Math.log(al[t].econ)), ys = known.map(t => Math.log(+al[t].power));
      const mx = sum(xs) / xs.length, my = sum(ys) / ys.length;
      const sxx = sum(xs.map(x => (x - mx) ** 2));
      if (sxx > 0) { pb1 = sum(xs.map((x, i) => (x - mx) * (ys[i] - my))) / sxx; pb0 = my - pb1 * mx; }
    }
    for (const t of tags) {
      const a = al[t];
      if (+a.power > 0) { a.pw = +a.power; a.pwImputed = false; }
      else { a.pw = Math.exp(pb0 + pb1 * Math.log(a.econ)); a.pwImputed = true; }
    }

    // growth per hour: measured from exact history pairs, else fitted
    const battleNetBetween = (tag, t1, t2) => {
      let n = 0;
      for (const b of battles) {
        if (b.t <= t1 || b.t > t2) continue;
        for (const p of b.defenders) if (p.tag === tag) n -= (+p.cu || 0);
        for (const p of b.attackers) if (p.tag === tag) n += (+p.cu || 0);
      }
      return n;
    };
    const measured = [];
    for (const t of tags) {
      const a = al[t];
      const h = a.hist.filter(x => x.exact).sort((x, y) => x.at - y.at);
      let best = null;
      for (let i = 0; i < h.length; i++) for (let j = i + 1; j < h.length; j++) {
        const dh = (h[j].at - h[i].at) / HOUR;
        if (dh < 0.75) continue;
        const g = (h[j].cu - h[i].cu - battleNetBetween(t, h[i].at, h[j].at)) / dh;
        if (!best || dh > best.dh) best = { g, dh };
      }
      if (best && best.g > 0) { a.growthMeasured = best.g; measured.push([a.econ, best.g]); }
      if (cfg.knownRates && cfg.knownRates[t]) measured.push([a.econ, cfg.knownRates[t]]);
    }
    let gk = 1, ga = null;
    if (measured.length >= 3) {
      const xs = measured.map(m => Math.log(m[0])), ys = measured.map(m => Math.log(m[1]));
      const mx = sum(xs) / xs.length, my = sum(ys) / ys.length;
      const sxx = sum(xs.map(x => (x - mx) ** 2));
      if (sxx > 0) { gk = clamp(sum(xs.map((x, i) => (x - mx) * (ys[i] - my))) / sxx, 0.5, 2.5); ga = my - gk * mx; }
    }
    const usTag = cfg.us;
    for (const t of tags) {
      const a = al[t];
      if (+a.growth > 0) { a.g = +a.growth; a.gSrc = 'set'; }
      else if (cfg.knownRates && cfg.knownRates[t]) { a.g = +cfg.knownRates[t]; a.gSrc = 'known'; }
      else if (a.growthMeasured) { a.g = a.growthMeasured; a.gSrc = 'measured'; }
      else if (ga !== null && measured.length >= 6) { a.g = Math.exp(ga + gk * Math.log(a.econ)); a.gSrc = 'fitted'; }
      else if (al[usTag] && cfg.knownRates && cfg.knownRates[usTag]) { a.g = cfg.knownRates[usTag] * a.econ / al[usTag].econ; a.gSrc = 'scaled'; }
      else { a.g = 0; a.gSrc = 'none'; }
    }

    // ---- rating model ----
    const medP = median(tags.map(t => al[t].pw));
    const medE = median(tags.map(t => al[t].econ));
    const rounds = [...new Set(battles.map(b => b.round))].sort((a, b) => a - b);
    function runModel(p, record) {
      const R = {};
      for (const t of tags) R[t] = 1500 + p.beta * Math.log(al[t].pw / medP) + p.gamma * Math.log(al[t].econ / medE);
      let ll = 0, n = 0, acc = 0;
      const h = Math.pow(10, p.H / 400);
      for (const r of rounds) {
        const pr = [];
        for (const b of battles) {
          if (b.round !== r) continue;
          const sa = sum(b.attackers.map(x => Math.pow(10, R[x.tag] / 400))) * h;
          const sd = sum(b.defenders.map(x => Math.pow(10, R[x.tag] / 400)));
          const P = sa / (sa + sd), o = b.winner === 'A' ? 1 : 0;
          const Pc = clamp(P, 0.001, 0.999);
          ll += -(o * Math.log(Pc) + (1 - o) * Math.log(1 - Pc)); n++; acc += ((P > 0.5) === (o === 1)) ? 1 : 0;
          pr.push([b, P, o]);
          if (record) b.pAtk = P;
        }
        for (const [b, P, o] of pr) {
          for (const x of b.attackers) R[x.tag] += p.K * (o - P);
          for (const x of b.defenders) R[x.tag] -= p.K * (o - P);
        }
      }
      return { R, ll: n ? ll / n : 0, n, acc };
    }
    let params = Object.assign({}, cfg.model);
    if (cfg.model.auto && battles.length >= 10) {
      let best = null;
      for (const beta of [400, 600, 800, 1000]) for (const gamma of [0, 100, 200, 300]) for (const H of [0, 30, 60, 90]) for (const K of [60, 100, 140, 180]) {
        const r = runModel({ beta, gamma, H, K }, false);
        // tiny penalty keeps parameters away from the extremes when the fit is flat
        const score = r.ll + 0.002 * (Math.abs(beta - 700) / 100 + Math.abs(gamma - 150) / 100 + Math.abs(K - 120) / 40);
        if (!best || score < best.score) best = { score, beta, gamma, H, K };
      }
      params = { auto: true, beta: best.beta, gamma: best.gamma, H: best.H, K: best.K };
    }
    const fit = runModel(params, true);
    const R = fit.R;
    for (const t of tags) al[t].rating = R[t];
    const hEdge = Math.pow(10, params.H / 400);
    const str = t => Math.pow(10, (R[t] || 1500) / 400);

    // ---- per-alliance stats ----
    for (const t of tags) Object.assign(al[t], { atkW: 0, atkL: 0, defW: 0, defL: 0, asW: 0, asL: 0, cuWon: 0, cuLost: 0, beatAtk: [], beatDef: [], log: [], upsetLosses: 0 });
    for (const b of battles) {
      const aWin = b.winner === 'A';
      const prim = b.defenders[0].tag;
      for (const x of b.attackers) {
        const a = al[x.tag];
        if (aWin) { a.atkW++; a.beatAtk.push(prim); } else a.atkL++;
        a.cuWon += (+x.cu || 0);
        a.log.push({ id: b.id, round: b.round, role: 'atk', win: aWin, cu: +x.cu || 0, opp: b.defenders.map(d => d.tag), mates: b.attackers.filter(y => y !== x).map(y => y.tag), p: b.pAtk });
      }
      b.defenders.forEach((x, i) => {
        const a = al[x.tag];
        const isAssist = i > 0;
        if (isAssist) { if (aWin) a.asL++; else { a.asW++; } }
        else if (aWin) a.defL++; else { a.defW++; }
        if (!aWin) b.attackers.forEach(y => a.beatDef.push(y.tag));
        a.cuLost += (+x.cu || 0);
        if (!isAssist && aWin && b.pAtk < 0.3) a.upsetLosses++;
        a.log.push({ id: b.id, round: b.round, role: isAssist ? 'assist' : 'def', win: !aWin, cu: -(+x.cu || 0), opp: b.attackers.map(y => y.tag), mates: b.defenders.filter(y => y !== x).map(y => y.tag), p: b.pAtk });
      });
    }

    // ---- schedule ----
    const w1 = serverToUtc(cfg, cfg.week1Start, '00:00');
    const schedule = cfg.rounds.map(r => {
      const t = serverToUtc(cfg, r.date, cfg.battleTime);
      const week = Math.floor((t - w1) / (7 * 24 * HOUR)) + 1;
      const weekStart = w1 + (week - 1) * 7 * 24 * HOUR;
      const decl = t - cfg.declLeadHours * HOUR;
      return Object.assign({}, r, { t, week, weekStart, decl, lockT: cfg.lockMode === 'week' ? weekStart : decl, played: battles.some(b => b.round === r.n) });
    });

    const M = { cfg, al, tags, battles, params, fit: { ll: fit.ll, n: fit.n, acc: fit.acc }, R, schedule, now, medP, medE, growthFit: { k: gk, a: ga, n: measured.length } };

    M.pwin = function (att, def, assists, assistW) {
      const sa = sum(att.map(str)) * hEdge;
      const sd = sum(def.map(str)) + (assists ? sum(assists.map(str)) * (assistW == null ? 1 : assistW) : 0);
      return sa / (sa + sd);
    };
    M.str = str;

    // copper map projected to time T (ms). base = map of extra deltas already applied
    M.project = function (T, deltas) {
      const out = {};
      for (const t of tags) {
        const a = al[t];
        const dh = Math.max(0, (T - a.copperAt) / HOUR);
        out[t] = a.copper + a.g * dh + ((deltas && deltas[t]) || 0);
      }
      return out;
    };
    M.factionOrder = function (cu, faction) {
      return tags.filter(t => al[t].faction === faction && !al[t].inactive && !al[t].unknown).sort((a, b) => cu[b] - cu[a]);
    };
    M.groupIdx = function (frank, week) {
      const s = cfg.weekSizes[week] || cfg.weekSizes[Math.max(...Object.keys(cfg.weekSizes).map(Number))];
      const capGroups = Math.floor((cfg.poolFrom - 1) / s);
      if (frank >= cfg.poolFrom) return capGroups + 1;
      return Math.floor((frank - 1) / s) + 1;
    };
    M.groupRange = function (idx, week) {
      const s = cfg.weekSizes[week] || 3;
      const capGroups = Math.floor((cfg.poolFrom - 1) / s);
      if (idx > capGroups) return [cfg.poolFrom, 100];
      return [(idx - 1) * s + 1, idx * s];
    };
    M.groupsAt = function (cu, week) {
      const ord = { red: M.factionOrder(cu, 'red'), blue: M.factionOrder(cu, 'blue') };
      const groups = {};
      for (const f of ['red', 'blue']) ord[f].forEach((t, i) => {
        const g = M.groupIdx(i + 1, week);
        (groups[g] = groups[g] || { idx: g, red: [], blue: [], range: M.groupRange(g, week) })[f].push(t);
      });
      const franks = {};
      for (const f of ['red', 'blue']) ord[f].forEach((t, i) => { franks[t] = i + 1; });
      return { list: Object.values(groups).sort((a, b) => a.idx - b.idx), byIdx: groups, franks, ord };
    };

    // ---- group simulation ----
    const loot = (cu, d) => ({ win: cu[d] * cfg.plunderPct * cfg.winTake, loss: cu[d] * cfg.plunderPct * cfg.lossTake });
    M.loot = loot;
    function soloEV(a, d, cu) {
      const P = M.pwin([a], [d]); const L = loot(cu, d);
      return P * L.win + (1 - P) * L.loss;
    }
    M.soloEV = soloEV;
    function softmax(vals, temp) {
      const m = Math.max(...vals);
      const e = vals.map(v => Math.exp((v - m) / temp));
      const s = sum(e);
      return e.map(x => x / s);
    }
    // resolve one joint choice: choice = {attackerTag: targetTag|null}
    function resolve(A, D, choice, cu, assistW) {
      const byT = {};
      for (const a of A) { const d = choice[a]; if (d) (byT[d] = byT[d] || []).push(a); }
      const free = D.filter(d => !byT[d]).sort((x, y) => str(y) - str(x));
      const targets = Object.keys(byT).sort((x, y) => byT[y].length - byT[x].length || sum(byT[y].map(str)) - sum(byT[x].map(str)));
      const ev = {}, res = {};
      for (const d of targets) {
        const S = byT[d];
        const allowed = Math.min(S.length - 1, 2);
        const assists = free.splice(0, allowed);
        const P = M.pwin(S, [d], assists, assistW);
        const L = loot(cu, d);
        const exp = P * L.win + (1 - P) * L.loss;
        const tot = sum(S.map(str));
        for (const a of S) ev[a] = (ev[a] || 0) + exp * str(a) / tot;
        ev[d] = (ev[d] || 0) - exp;
        res[d] = { attackers: S, assists, P, exp };
      }
      return { ev, res };
    }

    // fixed: {attackerTag: targetTag|'none'}
    M.simGroup = function (roundN, group, cu, fixed) {
      const r = schedule.find(x => x.n === roundN);
      const atkF = r.atk, defF = other(atkF);
      const A = group[atkF].slice(), D = group[defF].slice();
      fixed = fixed || {};
      const out = { round: roundN, atkF, defF, A, D, attackers: {}, defenders: {}, exact: false, plans: [] };
      if (!A.length || !D.length) {
        for (const a of A) out.attackers[a] = { probs: {}, ev: 0, cond: {} };
        for (const d of D) out.defenders[d] = { pAttacked: 0, pLose: 0, expLoss: 0, scen: [] };
        return out;
      }
      const probs = {};
      for (const a of A) {
        if (fixed[a]) { probs[a] = {}; if (fixed[a] !== 'none' && D.includes(fixed[a])) probs[a][fixed[a]] = 1; continue; }
        const evs = D.map(d => soloEV(a, d, cu));
        const p = softmax(evs, cfg.choiceTemp);
        probs[a] = {}; D.forEach((d, i) => { probs[a][d] = p[i]; });
      }
      for (const a of A) out.attackers[a] = { probs: probs[a], ev: 0, cond: {}, condPair: {}, solo: Object.fromEntries(D.map(d => [d, { P: M.pwin([a], [d]), ev: soloEV(a, d, cu) }])) };
      for (const d of D) out.defenders[d] = { pAttacked: 0, pLose: 0, expLoss: 0, scen: [] };
      const combos = Math.pow(D.length + 1, A.length);
      if (A.length <= 4 && D.length <= 5 && combos <= 1300) {
        out.exact = true;
        const opts = A.map(a => { const o = Object.entries(probs[a]).filter(([, p]) => p > 1e-6); return o.length ? o : [[null, 1]]; });
        const condAcc = {};
        const rec = (i, choice, pi) => {
          if (i === A.length) {
            const { ev, res } = resolve(A, D, choice, cu, cfg.assistProb);
            for (const a of A) {
              out.attackers[a].ev += pi * (ev[a] || 0);
              const c = choice[a];
              if (c) {
                const k = a + '|' + c; condAcc[k] = condAcc[k] || { p: 0, ev: 0 }; condAcc[k].p += pi; condAcc[k].ev += pi * (ev[a] || 0);
              }
            }
            for (const d of D) {
              if (res[d]) {
                const o = out.defenders[d];
                o.pAttacked += pi; o.pLose += pi * res[d].P; o.expLoss += pi * res[d].exp;
                o.scen.push({ p: pi, attackers: res[d].attackers, assists: res[d].assists, P: res[d].P, exp: res[d].exp });
              }
            }
            return;
          }
          for (const [d, p] of opts[i]) { choice[A[i]] = d; rec(i + 1, choice, pi * p); }
          delete choice[A[i]];
        };
        rec(0, {}, 1);
        for (const a of A) for (const d of D) {
          const k = a + '|' + d;
          // conditional EV if attacker a commits to d (others follow their own choice model)
          const others = A.filter(x => x !== a);
          let acc = 0, pacc = 0;
          const rec2 = (i, choice, pi) => {
            if (i === others.length) { const { ev } = resolve(A, D, Object.assign({}, choice, { [a]: d }), cu, cfg.assistProb); acc += pi * (ev[a] || 0); pacc += pi; return; }
            const o = Object.entries(probs[others[i]]).filter(([, p]) => p > 1e-6);
            if (!o.length) return rec2(i + 1, choice, pi);
            for (const [dd, p] of o) { choice[others[i]] = dd; rec2(i + 1, choice, pi * p); }
            delete choice[others[i]];
          };
          rec2(0, {}, 1);
          out.attackers[a].cond[d] = pacc ? acc / pacc : 0;
          // paired: a and partner both on d, third parties per model
          for (const partner of others) {
            const rest = others.filter(x => x !== partner);
            let acc2 = 0, pacc2 = 0, Pw = 0, share = 0;
            const rec3 = (i, choice, pi) => {
              if (i === rest.length) {
                const full = Object.assign({}, choice, { [a]: d, [partner]: d });
                const { ev, res } = resolve(A, D, full, cu, cfg.assistProb);
                acc2 += pi * (ev[a] || 0); pacc2 += pi; Pw += pi * res[d].P;
                share += pi * str(a) / sum(res[d].attackers.map(str));
                return;
              }
              const o = Object.entries(probs[rest[i]]).filter(([, p]) => p > 1e-6);
              if (!o.length) return rec3(i + 1, choice, pi);
              for (const [dd, p] of o) { choice[rest[i]] = dd; rec3(i + 1, choice, pi * p); }
              delete choice[rest[i]];
            };
            rec3(0, {}, 1);
            out.attackers[a].condPair[d + '|' + partner] = { ev: pacc2 ? acc2 / pacc2 : 0, P: pacc2 ? Pw / pacc2 : 0, share: pacc2 ? share / pacc2 : 0 };
          }
          // conditional win probability for solo commit (with others' model)
          let Pw = 0, pw = 0;
          const rec4 = (i, choice, pi) => {
            if (i === others.length) { const { res } = resolve(A, D, Object.assign({}, choice, { [a]: d }), cu, cfg.assistProb); Pw += pi * res[d].P; pw += pi; return; }
            const o = Object.entries(probs[others[i]]).filter(([, p]) => p > 1e-6);
            if (!o.length) return rec4(i + 1, choice, pi);
            for (const [dd, p] of o) { choice[others[i]] = dd; rec4(i + 1, choice, pi * p); }
            delete choice[others[i]];
          };
          rec4(0, {}, 1);
          out.attackers[a].condP = out.attackers[a].condP || {};
          out.attackers[a].condP[d] = pw ? Pw / pw : 0;
        }
        // deterministic plans (every attacker declares on someone)
        const all = [];
        const rec5 = (i, choice) => {
          if (i === A.length) { const { ev, res } = resolve(A, D, choice, cu, cfg.assistProb); all.push({ choice: Object.assign({}, choice), ev, res, total: sum(A.map(a => ev[a] || 0)) }); return; }
          for (const d of D) { choice[A[i]] = d; rec5(i + 1, choice); }
        };
        if (Math.pow(D.length, A.length) <= 400) rec5(0, {});
        out.plans = all;
      } else {
        // large group (pool): independent approximation
        for (const a of A) {
          let ev = 0;
          for (const d of D) { const p = probs[a][d] || 0; const e = soloEV(a, d, cu); ev += p * e; out.attackers[a].cond[d] = e; (out.attackers[a].condP = out.attackers[a].condP || {})[d] = M.pwin([a], [d]); }
          out.attackers[a].ev = ev;
        }
        for (const d of D) {
          let notAtt = 1, loss = 0, plose = 0;
          for (const a of A) { const p = probs[a][d] || 0; notAtt *= (1 - p); const P = M.pwin([a], [d]); const L = loot(cu, d); loss += p * (P * L.win + (1 - P) * L.loss); plose += p * P; }
          const o = out.defenders[d];
          o.pAttacked = 1 - notAtt; o.expLoss = Math.min(loss, loot(cu, d).win); o.pLose = Math.min(plose, 1);
        }
      }
      for (const d of D) out.defenders[d].scen.sort((x, y) => y.p - x.p);
      return out;
    };

    // simulate a whole round: expected copper deltas for everyone
    M.simRound = function (roundN, cu, fixedByRound) {
      const r = schedule.find(x => x.n === roundN);
      const gs = M.groupsAt(cu, r.week);
      const deltas = {}, sims = {};
      for (const g of gs.list) {
        const s = M.simGroup(roundN, g, cu, fixedByRound && fixedByRound[roundN]);
        sims[g.idx] = s;
        for (const a of s.A) deltas[a] = (deltas[a] || 0) + s.attackers[a].ev;
        for (const d of s.D) deltas[d] = (deltas[d] || 0) - s.defenders[d].expLoss;
      }
      return { round: r, groups: gs, sims, deltas };
    };

    // forecast the rest of the event for every alliance, with optional overrides for us
    // usPolicy: {roundN: 'hold'|'fold'|'model'|targetTag}
    M.forecast = function (usPolicy, fixedByRound) {
      usPolicy = usPolicy || {};
      const us = cfg.us;
      const upcoming = schedule.filter(r => !r.played && r.t > now);
      let extra = {}; // accumulated expected battle deltas
      const steps = [];
      for (const r of upcoming) {
        const cuLock = M.project(r.lockT, extra);
        const cuBattle = M.project(r.t, extra);
        const sr = M.simRound(r.n, cuLock, fixedByRound);
        // use battle-time copper for loot sizes: rescale deltas by ratio (approx)
        const gIdx = sr.groups.franks[us] ? M.groupIdx(sr.groups.franks[us], r.week) : null;
        const sim = gIdx ? sr.sims[gIdx] : null;
        const deltas = Object.assign({}, sr.deltas);
        let usDelta = deltas[us] || 0, note = 'model';
        const pol = usPolicy[r.n];
        if (sim && pol && pol !== 'model') {
          if (sim.D.includes(us)) {
            // conditional on being declared on
            const o = sim.defenders[us]; const L = loot(cuBattle, us);
            const pl = o.pAttacked ? o.pLose / o.pAttacked : 0.5;
            if (pol === 'fold') { usDelta = -L.win; note = 'declared on, we fold'; }
            if (pol === 'hold') { usDelta = -L.loss; note = 'declared on, we hold'; }
            if (pol === 'fight') { usDelta = -(pl * L.win + (1 - pl) * L.loss); note = 'declared on, we fight'; }
            if (pol === 'spared') { usDelta = 0; note = 'nobody declares on us'; }
          } else if (sim.A.includes(us) && sim.attackers[us]) {
            if (pol === 'skip') { usDelta = 0; note = 'no declaration'; }
            else if (sim.attackers[us].cond[pol] != null) { usDelta = sim.attackers[us].cond[pol]; note = 'declare on ' + pol; }
          }
        }
        deltas[us] = usDelta;
        for (const t of Object.keys(deltas)) extra[t] = (extra[t] || 0) + deltas[t];
        const after = M.project(r.t + 1, extra);
        steps.push({ round: r, cuLock, cuBattle, after, sim, gIdx, frankLock: sr.groups.franks[us], usDelta, note, groups: sr.groups, sr });
      }
      const end = M.project((upcoming.length ? upcoming[upcoming.length - 1].t : now) + 1, extra);
      const endOrder = M.factionOrder(end, al[us] ? al[us].faction : 'red');
      return { steps, end, endFrank: endOrder.indexOf(us) + 1, endOverall: [...tags].filter(t => !al[t].inactive && !al[t].unknown).sort((a, b) => end[b] - end[a]).indexOf(us) + 1, extra };
    };

    // value of each rank band for one attack round + one defense round in the same week
    // Coordinated declarations for a set of friendly alliances ("zone") inside one group.
    // Zone attackers are assigned jointly; every other attacker follows the choice model.
    M.zonePlans = function (roundN, group, cu, zone, indiv) {
      const r = schedule.find(x => x.n === roundN);
      const atkF = r.atk, defF = other(atkF);
      const A = group[atkF] || [], D = group[defF] || [];
      const Z = A.filter(t => zone.includes(t));
      if (!Z.length || !D.length) return null;
      const others = A.filter(t => !Z.includes(t));
      const probs = {};
      for (const o of others) { const p = softmax(D.map(d => soloEV(o, d, cu)), cfg.choiceTemp); probs[o] = D.map((d, i) => [d, p[i]]).filter(x => x[1] > 1e-4); }
      // candidate targets per zone alliance (trim when the space is large)
      let opts = Z.map(z => D.slice());
      if (Math.pow(D.length, Z.length) > 81) opts = Z.map(z => D.slice().sort((x, y) => soloEV(z, y, cu) - soloEV(z, x, cu)).slice(0, Z.length > 4 ? 2 : 3));
      // others' joint choices: exact when small, else a fixed seeded sample
      let combos = [];
      const nCombos = others.reduce((s, o) => s * probs[o].length, 1);
      if (nCombos <= 729) {
        const rec = (i, ch, p) => { if (i === others.length) { combos.push([Object.assign({}, ch), p]); return; } for (const [d, q] of probs[others[i]]) { ch[others[i]] = d; rec(i + 1, ch, p * q); } delete ch[others[i]]; };
        rec(0, {}, 1);
      } else {
        let seed = 12345; const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
        for (let k = 0; k < 160; k++) { const ch = {}; for (const o of others) { let u = rnd(), acc = 0; for (const [d, q] of probs[o]) { acc += q; if (u <= acc) { ch[o] = d; break; } } if (!ch[o]) ch[o] = probs[o][probs[o].length - 1][0]; } combos.push([ch, 1 / 160]); }
      }
      const evalAssign = asg => {
        const ev = {}, P = {}, share = {}; let tot = 0;
        for (const z of Z) { ev[z] = 0; P[z] = 0; share[z] = 0; }
        for (const [ch, p] of combos) {
          const full = Object.assign({}, ch, asg);
          const { ev: e, res } = resolve(A, D, full, cu, cfg.assistProb);
          for (const z of Z) { ev[z] += p * (e[z] || 0); const t = asg[z]; if (t && res[t]) { P[z] += p * res[t].P; share[z] += p * str(z) / sum(res[t].attackers.map(str)); } }
        }
        for (const z of Z) tot += ev[z];
        return { asg: Object.assign({}, asg), ev, P, share, total: tot };
      };
      const plans = [];
      const rec = (i, asg) => { if (i === Z.length) { plans.push(evalAssign(asg)); return; } for (const d of opts[i]) { asg[Z[i]] = d; rec(i + 1, asg); } delete asg[Z[i]]; };
      rec(0, {});
      plans.sort((x, y) => y.total - x.total);
      const own = indiv ? evalAssign(indiv) : null;
      return { Z, D, others, plans, best: plans[0], own, exact: nCombos <= 729 };
    };

    M.bandValues = function (atkRoundN, defRoundN, baseCu) {
      const us = cfg.us; const f = al[us].faction;
      const r = schedule.find(x => x.n === atkRoundN) || schedule.find(x => x.n === defRoundN);
      const week = r.week;
      const s = cfg.weekSizes[week] || 3;
      const others = M.factionOrder(baseCu, f).filter(t => t !== us);
      const nb = Math.floor((cfg.poolFrom - 1) / s) + 1;
      const out = [];
      for (let b = 1; b <= nb; b++) {
        const [lo, hi] = M.groupRange(b, week);
        if (lo > others.length + 1) break;
        const k = Math.min(lo - 1 + Math.floor(Math.min(s, 3) / 2), others.length);
        const above = k > 0 ? baseCu[others[k - 1]] : baseCu[others[0]] + 20000;
        const below = k < others.length ? baseCu[others[k]] : Math.max(0, above - 20000);
        const cu = Object.assign({}, baseCu, { [us]: (above + below) / 2 });
        const gs = M.groupsAt(cu, week);
        const gi = M.groupIdx(gs.franks[us], week);
        const grp = gs.byIdx[gi];
        let atkEV = 0, defLoss = 0, pAtt = 0, pLose = 0, best = null;
        if (atkRoundN) {
          const s1 = M.simGroup(atkRoundN, grp, cu);
          if (s1.attackers[us]) {
            const c = s1.attackers[us].cond; const bestT = Object.keys(c).sort((x, y) => c[y] - c[x])[0];
            atkEV = bestT ? c[bestT] : 0; best = bestT;
          }
        }
        if (defRoundN) {
          const s2 = M.simGroup(defRoundN, grp, cu);
          if (s2.defenders[us]) { defLoss = s2.defenders[us].expLoss; pAtt = s2.defenders[us].pAttacked; pLose = s2.defenders[us].pAttacked ? s2.defenders[us].pLose / s2.defenders[us].pAttacked : 0; }
        }
        out.push({ band: b, lo, hi, cuLevel: cu[us], atkEV, defLoss, value: atkEV - defLoss, bestTarget: best, pAtt, pLose, enemies: grp[other(f)].slice(), mates: grp[f].filter(t => t !== us) });
      }
      return out;
    };

    return M;
  }

  G.CW = { build, DEFAULT_CFG, mergeCfg, serverToUtc, other };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HOUR = 3600e3;
const S = { alliances: [], battles: [], cfg: null, plans: {}, got: { al:false, b:false, cfg:false }, db: null, canWrite: false, dbState: 'connecting',
  tab: 'room', fFaction: 'all', fGroup: 'all', q: '', basis: 'f', sort: { key: 'frank', dir: 1 }, open: null, selRound: null, selGroup: null, zone: null, zoneRound: null, editBattle: null, editTag: null };
try { const t = localStorage.getItem('qiet.tab'); if (t) S.tab = t; } catch (e) {}
let M = null, memo = {};

/* ---------- formatting ---------- */
function fCu(n, d){ if (n == null || !isFinite(n)) return '—'; const a = Math.abs(n), s = n < 0 ? '−' : ''; if (a >= 1e6) return s + (a/1e6).toFixed(d == null ? 2 : d) + 'M'; if (a >= 1e3) return s + (a/1e3).toFixed(a >= 1e5 ? 0 : 1) + 'K'; return s + Math.round(a); }
function fSigned(n){ if (!isFinite(n)) return '—'; return (n > 0 ? '+' : n < 0 ? '' : '±') + fCu(n); }
function fPct(p){ return p == null || !isFinite(p) ? '—' : Math.round(p * 100) + '%'; }
function fPow(g){ if (!g) return '—'; return g >= 1 ? g.toFixed(1) + 'G' : Math.round(g * 1000) + 'M'; }
function parseCu(s){ if (s == null) return NaN; s = String(s).trim().replace(/,/g,'').replace(/^\+|^−|^-/,''); const m = s.match(/^([\d.]+)\s*([kKmM]?)$/); if (!m) return NaN; let v = parseFloat(m[1]); if (/k/i.test(m[2])) v *= 1e3; if (/m/i.test(m[2])) v *= 1e6; return Math.round(v); }
function serverStr(t, withDay){ const c = M ? M.cfg : CW.DEFAULT_CFG; const d = new Date(t + c.serverUtcOffset * HOUR); const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']; const mo = d.getUTCMonth()+1, da = d.getUTCDate(); const hh = String(d.getUTCHours()).padStart(2,'0'), mm = String(d.getUTCMinutes()).padStart(2,'0'); return (withDay ? days[d.getUTCDay()] + ' ' : '') + mo + '/' + da + ' ' + hh + ':' + mm; }
function localStr(t){ try { return new Date(t).toLocaleString([], { weekday:'short', month:'numeric', day:'numeric', hour:'numeric', minute:'2-digit' }); } catch(e){ return new Date(t).toISOString(); } }
function until(t){ const d = t - Date.now(); if (d <= 0) return 'now'; const h = Math.floor(d / HOUR), m = Math.floor((d % HOUR) / 60000); return h >= 48 ? Math.floor(h/24) + 'd ' + (h%24) + 'h' : h + 'h ' + String(m).padStart(2,'0') + 'm'; }
function fname(f){ return M ? M.cfg.factions[f].name : f; }
function chipF(f){ return '<span class="fchip ' + f + '"><span class="dot ' + f + '"></span>' + esc(fname(f)) + '</span>'; }
function tagH(t, withDot){ const a = M && M.al[t]; const f = a ? a.faction : ''; return (withDot && f ? '<span class="dot ' + f + '" style="margin-right:6px"></span>' : '') + '<span class="tag">[' + esc(t) + ']</span>'; }
function toast(msg){ const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 2400); }

/* ---------- model ---------- */
function recompute(){
  if (!S.alliances.length) { M = null; return; }
  try { M = CW.build(S.alliances, S.battles, S.cfg || {}, {}); } catch (e) { console.error(e); M = null; }
  memo = {};
}
const us = () => M.cfg.us;
const fixedByRound = () => { const o = {}; for (const k of Object.keys(S.plans)) { const p = S.plans[k]; if (p && p.round && p.fixed) o[p.round] = p.fixed; } return o; };
function forecast(pol){ const key = 'f' + JSON.stringify(pol || {}); if (!memo[key]) memo[key] = M.forecast(pol || {}, fixedByRound()); return memo[key]; }
function upcoming(){ return M.schedule.filter(r => !r.played && r.t > Date.now() - 2 * HOUR); }
function stepFor(n, pol){ const f = forecast(pol); return f.steps.find(s => s.round.n === n); }
function ourF(){ return M.al[us()] ? M.al[us()].faction : 'red'; }
function roleOf(r){ return r.atk === ourF() ? 'attack' : 'defend'; }
function curGroupOf(tag){ const nx = upcoming()[0]; if (!nx) return null; const st = stepFor(nx.n); if (!st || !st.groups.franks[tag]) return null; return M.groupIdx(st.groups.franks[tag], nx.week); }
function aggScen(scen){ const m = {}; for (const s of scen) { const k = s.attackers.join('+') + '|' + s.assists.join('+'); (m[k] = m[k] || { attackers: s.attackers, assists: s.assists, p: 0, P: 0 }); m[k].p += s.p; m[k].P += s.p * s.P; } return Object.values(m).map(x => (x.P /= x.p, x)).sort((a, b) => b.p - a.p); }

/* ---------- top strip ---------- */
function renderTop(){
  const el = $('#nextStrip');
  if (!M || !M.al[us()]) { el.innerHTML = '<span class="muted">Copper Conquest · Evernight Isle</span>'; return; }
  const a = M.al[us()];
  $('#brandTag').textContent = '[' + a.tag + ']';
  const zt = $('#tab-zone'); if (zt) zt.textContent = 'Warzone ' + (S.zone || a.warzone || '');
  const bf = $('#brandFaction'); bf.textContent = fname(a.faction); bf.className = 'fchip ' + a.faction;
  const nx = upcoming()[0];
  if (!nx) { el.innerHTML = '<span class="muted">No rounds left on the schedule</span>'; return; }
  const role = roleOf(nx);
  el.innerHTML = '<span class="pill ' + (role === 'attack' ? 'cu' : 'warn') + '">Round ' + nx.n + ' · we ' + role + '</span>' +
    '<span>Battle <b>' + esc(serverStr(nx.t, true)) + '</b> server</span><span class="muted">(' + esc(localStr(nx.t)) + ' your time)</span>' +
    '<span class="muted">· in ' + until(nx.t) + '</span>';
}

/* ---------- War Room ---------- */
function unitRow(t, cu, extra){
  const a = M.al[t];

    '<span class="meta">#' + esc(a.warzone || '?') + ' · ' + fPow(a.pw) + (a.pwImputed ? ' est.' : '') + ' power · rating ' + Math.round(a.rating) + '</span></div>' +
    '<div class="r"><span class="mono">' + fCu(cu[t]) + '</span><span class="meta">A ' + a.atkW + '–' + a.atkL + ' · D ' + a.defW + '–' + a.defL + '</span>' + (extra ? '<span class="meta">' + extra + '</span>' : '') + '</div></div>';
}
function renderRoom(){
  const a = M.al[us()];
  if (!a) return '<section class="panel"><div class="empty"><h3>Set your alliance</h3><p>The tag in Settings (' + esc(us()) + ') is not in the alliance list yet. Add it on the Data tab.</p></div></section>';

  const nx = up[0];
  let h = '';
  // identity
  h += '<section class="panel"><div class="panel-h"><div><div class="eyebrow">Our alliance</div><h2>' + tagH(a.tag) + ' ' + esc(a.name) + '</h2></div>' + chipF(a.faction) + '</div>' +
    '<div class="idstrip">' +
    stat(a.frank ? '#' + a.frank : '—', 'Rank in ' + fname(a.faction)) +
    stat(a.rank ? '#' + a.rank : '—', 'Overall copper rank') +
    stat(fCu(a.copper), 'Copper (as of ' + esc(serverStr(a.copperAt)) + ')') +
    stat(fPow(a.pw), 'Total member power') +
    stat(fCu(a.copper * M.cfg.plunderPct), 'Max plunder on us') +
    stat('A ' + a.atkW + '–' + a.atkL + ' · D ' + a.defW + '–' + a.defL, 'Record') +
    '</div></section>';
  if (!nx) return h + '<section class="panel"><p>No upcoming rounds on the schedule.</p></section>';
  const st = stepFor(nx.n);
  // matchup for next round
  if (st && st.sim) {
    const sim = st.sim, cu = st.cuLock;
    const mates = st.groups.byIdx[st.gIdx][ourF()], foes = st.groups.byIdx[st.gIdx][CW.other(ourF())];
    const [lo, hi] = M.groupRange(st.gIdx, nx.week);
    h += '<section class="panel"><div class="panel-h"><div><div class="eyebrow">Week ' + nx.week + ' declaration group ' + st.gIdx + ' · faction ranks ' + lo + '–' + (hi >= 100 ? '100' : hi) + '</div><h2>Who we can fight</h2></div>' +
      '<span class="small muted">Projected at declaration (' + esc(serverStr(nx.lockT, true)) + ' server)</span></div>' +
      '<div class="matchup"><div class="side">' + mates.map(t => unitRow(t, cu)).join('') + '</div><div class="vs">VS</div><div class="side">' + foes.map(t => unitRow(t, cu)).join('') + '</div></div>' +
      '<p class="small muted">Groups pair the same rank band in each faction. Copper shown is projected to when declarations open, using each alliance’s production rate.</p></section>';
  }
  // recommendation cards
  h += '<div class="grid3">';
  const nd = up.find(r => roleOf(r) === 'defend');
  const na = up.find(r => roleOf(r) === 'attack');
  if (nd) h += defenseCard(nd);
  if (na) h += attackCard(na);
  if (nd) h += tankCard(nd);
  h += '</div>';
  h += '<section class="panel"><div class="split"><span class="small muted">Model: rating from member power, economy and every recorded result. It called <b>' + M.fit.acc + ' of ' + M.fit.n + '</b> past fights correctly before they happened (attackers won ' + Math.round(100 * M.battles.filter(b => b.winner === 'A').length / Math.max(1, M.battles.length)) + '% overall).</span>' +
    '<button class="btn ghost small" data-goto="strategy">How the numbers work</button></div></section>';
  return h;
}
function stat(v, l){ return '<div class="stat"><span class="v">' + v + '</span><span class="l">' + l + '</span></div>'; }
function defenseCard(r){
  const st = stepFor(r.n); if (!st || !st.sim || !st.sim.defenders[us()]) return '';
  const o = st.sim.defenders[us()], cu = st.cuBattle;
  const pl = o.pAttacked ? o.pLose / o.pAttacked : 0;
  const foes = st.sim.A;
  const marg = foes.map(e => ({ e, p: (st.sim.attackers[e].probs[us()] || 0), P: M.pwin([e], [us()]) })).sort((x, y) => y.p - x.p);
  const L = M.loot(cu, us());
  return '<section class="panel rec"><div class="eyebrow">Round ' + r.n + ' · ' + esc(serverStr(r.t, true)) + ' · we defend</div><h3>Defense outlook</h3>' +
    '<div class="split"><span class="big">' + fCu(-o.expLoss) + '</span><span class="small muted">expected copper change</span></div>' +
    '<dl class="kv"><dt>Chance someone declares on us</dt><dd>' + fPct(o.pAttacked) + '</dd><dt>Chance we lose if declared on</dt><dd>' + fPct(pl) + '</dd><dt>Loss if the center falls</dt><dd>' + fCu(-L.win) + '</dd></dl>' +
    '<div class="small muted">Most likely to declare on us</div><ul class="plain small">' + marg.map(x => '<li>' + tagH(x.e) + ' — picks us ' + fPct(x.p) + ' of the time, wins 1v1 ' + fPct(x.P) + '</li>').join('') + '</ul>' +
    '<button class="btn" data-goto="declare" data-round="' + r.n + '">Open defense plan</button></section>';
}
function attackCard(r){
  const st = stepFor(r.n); if (!st || !st.sim || !st.sim.attackers[us()]) return '<section class="panel rec"><div class="eyebrow">Round ' + r.n + ' · we attack</div><h3>No targets in our group</h3><p class="small muted">Our projected group has no enemy alliances.</p></section>';
  const A = st.sim.attackers[us()];
  const rows = Object.keys(A.cond).map(t => ({ t, ev: A.cond[t], P: A.condP ? A.condP[t] : null, solo: A.solo ? A.solo[t].P : null, mp: st.cuBattle[t] * M.cfg.plunderPct })).sort((x, y) => y.ev - x.ev);
  const best = rows[0];
  return '<section class="panel rec"><div class="eyebrow">Round ' + r.n + ' · ' + esc(serverStr(r.t, true)) + ' · we attack</div><h3>Best declaration</h3>' +
    '<div class="split"><span class="big">' + tagH(best.t) + '</span><span class="small muted">expected ' + fSigned(best.ev) + '</span></div>' +
    '<div class="tbl-wrap"><table><thead><tr><th>Target</th><th class="n">Win 1v1</th><th class="n">Max plunder</th><th class="n">Expected</th></tr></thead><tbody>' +
    rows.map(x => '<tr><td>' + tagH(x.t) + '</td><td class="n">' + fPct(x.solo) + '</td><td class="n">' + fCu(x.mp) + '</td><td class="n">' + fSigned(x.ev) + '</td></tr>').join('') + '</tbody></table></div>' +
    '<p class="small muted">Expected copper includes the chance that faction-mates pile onto the same target, which splits the loot and lets the defender invite an assist.</p>' +
    '<button class="btn" data-goto="declare" data-round="' + r.n + '">Open declaration planner</button></section>';
}
function tankCard(r){
  const fight = forecast({ [r.n]: 'fight' }), fold = forecast({ [r.n]: 'fold' });
  const d = fold.end[us()] - fight.end[us()];
  const good = d > 0;
  return '<section class="panel rec"><div class="eyebrow">Round ' + r.n + ' · if we are declared on</div><h3>Tank check</h3>' +
    '<div class="split"><span class="big">' + (good ? 'Fold' : 'Fight') + '</span><span class="small muted">' + (good ? 'folding ends ' + fCu(d) + ' ahead' : 'fighting ends ' + fCu(-d) + ' ahead') + '</span></div>' +
    '<dl class="kv"><dt>Fight it out: end copper</dt><dd>' + fCu(fight.end[us()]) + ' · #' + fight.endFrank + '</dd><dt>Lose on purpose: end copper</dt><dd>' + fCu(fold.end[us()]) + ' · #' + fold.endFrank + '</dd></dl>' +
    '<p class="verdict">' + (good ? 'Dropping into a weaker group is worth more than the copper it costs.' : 'The easier group a loss would buy us is not worth the copper we would hand over.') + '</p>' +
    '<button class="btn" data-goto="strategy">See all scenarios</button></section>';
}

/* ---------- Alliances ---------- */
function beatStats(list){ const k = S.basis === 'f' ? 'frank' : 'rank'; const v = list.map(t => M.al[t] && M.al[t][k]).filter(x => x); if (!v.length) return null; return { avg: v.reduce((s, x) => s + x, 0) / v.length, best: Math.min(...v), low: Math.max(...v), n: v.length }; }
function beatH(b){ return b ? '<span class="beat" title="average rank ' + b.avg.toFixed(1) + ', best ' + b.best + ', lowest ' + b.low + '"><b>' + b.avg.toFixed(1) + '</b> <span class="muted">(' + (b.best === b.low ? '#' + b.best : '#' + b.best + '–' + b.low) + ')</span></span>' : '<span class="muted">—</span>'; }
function pipsH(a){
  const rounds = M.cfg.rounds.filter(r => M.battles.some(b => b.round === r.n)).map(r => r.n);
  return '<span class="pips">' + rounds.map(n => { const e = a.log.find(x => x.round === n); if (!e) return '<span class="pip e" title="Round ' + n + ': no fight">·</span>'; const L = e.role === 'atk' ? 'A' : e.role === 'def' ? 'D' : 'S'; return '<span class="pip' + (e.win ? ' w' : '') + '" title="Round ' + n + ': ' + (e.role === 'atk' ? 'attacked' : e.role === 'def' ? 'defended' : 'assisted') + ' vs ' + esc(e.opp.join(', ')) + ' — ' + (e.win ? 'won' : 'lost') + '">' + L + '</span>'; }).join('') + '</span>';
}
function allianceRows(){
  const gIdxNow = {};
  const nx = upcoming()[0]; let st = null;
  if (nx) { st = stepFor(nx.n); }
  return M.tags.map(t => M.al[t]).filter(a => !a.unknown).map(a => {
    const g = st && st.groups.franks[a.tag] ? M.groupIdx(st.groups.franks[a.tag], nx.week) : null;
    const bA = beatStats(a.beatAtk), bD = beatStats(a.beatDef);
    const fights = a.atkW + a.atkL + a.defW + a.defL;
    return { a, t: a.tag, g, frank: a.frank || 999, rank: a.rank || 999, copper: a.copper, pw: a.pw, rating: a.rating, atk: a.atkW - a.atkL + a.atkW * 0.01, def: a.defW - a.defL + a.defW * 0.01, bA, bD, bAavg: bA ? bA.avg : 999, bDavg: bD ? bD.avg : 999, net: a.net, fights };
  });
}
function renderAlliances(){
  const nx = upcoming()[0];
  let rows = allianceRows();
  if (S.fFaction !== 'all') rows = rows.filter(r => r.a.faction === S.fFaction);
  if (S.fGroup === 'ours') { const g = curGroupOf(us()); rows = rows.filter(r => r.g === g); }
  if (S.q) { const q = S.q.toLowerCase(); rows = rows.filter(r => r.t.toLowerCase().includes(q) || String(r.a.name || '').toLowerCase().includes(q) || String(r.a.warzone).includes(q)); }
  const k = S.sort.key, dir = S.sort.dir;
  rows.sort((x, y) => { const vx = x[k], vy = y[k]; if (typeof vx === 'string') return dir * vx.localeCompare(vy); return dir * ((vx ?? 0) - (vy ?? 0)) || x.frank - y.frank; });
  const th = (key, label, cls) => '<th class="sortable ' + (cls || '') + '" data-sort="' + key + '" aria-sort="' + (S.sort.key === key ? (S.sort.dir > 0 ? 'ascending' : 'descending') : 'none') + '">' + label + (S.sort.key === key ? ' <span class="arr">' + (S.sort.dir > 0 ? '▲' : '▼') + '</span>' : '') + '</th>';
  const basisLbl = S.basis === 'f' ? 'faction rank' : 'overall rank';
  let h = '<section class="panel"><div class="panel-h"><div><div class="eyebrow">Performance</div><h2>Every alliance, attack vs defense</h2></div><span class="small muted">' + rows.length + ' shown · tap a row for its battle log</span></div>' +
    '<div class="controls">' +
    '<div class="seg" role="group" aria-label="Faction"><button data-ff="all" aria-pressed="' + (S.fFaction === 'all') + '">All</button><button data-ff="red" aria-pressed="' + (S.fFaction === 'red') + '">' + esc(fname('red')) + '</button><button data-ff="blue" aria-pressed="' + (S.fFaction === 'blue') + '">' + esc(fname('blue')) + '</button></div>' +
    '<div class="seg" role="group" aria-label="Group"><button data-fg="all" aria-pressed="' + (S.fGroup === 'all') + '">All groups</button><button data-fg="ours" aria-pressed="' + (S.fGroup === 'ours') + '">Our group' + (nx ? ' (R' + nx.n + ')' : '') + '</button></div>' +
    '<div class="seg" role="group" aria-label="Rank basis"><button data-basis="f" aria-pressed="' + (S.basis === 'f') + '">Faction rank</button><button data-basis="o" aria-pressed="' + (S.basis === 'o') + '">Overall rank</button></div>' +
    '<input type="search" id="q" placeholder="Search tag, name, warzone" value="' + esc(S.q) + '" aria-label="Search alliances">' +
    '</div>' +
    '<p class="small muted">“Beaten on attack” is the average current ' + basisLbl + ' of defenders they broke, with the best and lowest in brackets. “Held against” is the same for attackers they repelled. Lower numbers mean stronger opponents.</p>' +
    '<div class="tbl-wrap"><table><thead><tr>' +
    th(S.basis === 'f' ? 'frank' : 'rank', 'Rank', 'n') + th('t', 'Alliance', 'stick') + th('g', 'Grp', 'n') + th('pw', 'Power', 'n') + th('copper', 'Copper', 'n') + th('rating', 'Rating', 'n') +
    '<th>Rounds</th>' + th('atk', 'Attack', 'n') + th('bAavg', 'Beaten on attack') + th('def', 'Defense', 'n') + th('bDavg', 'Held against') + th('net', 'Battle copper', 'n') + '<th>Notes</th></tr></thead><tbody>';
  for (const r of rows) {
    const a = r.a;
    const flags = [];
    if (a.inactive) flags.push('<span class="pill">not ranked</span>');
    if (a.upsetLosses) flags.push('<span class="pill warn" title="Lost a defense the model expected them to hold">soft defense ×' + a.upsetLosses + '</span>');
    if (a.defW >= 2 && a.defL === 0) flags.push('<span class="pill good">wall</span>');
    if (a.pwImputed) flags.push('<span class="pill">power est.</span>');
    h += '<tr class="click' + (a.tag === us() ? ' us-row' : '') + '" data-open="' + esc(a.tag) + '" tabindex="0"><td class="n mono">' + (S.basis === 'f' ? (a.frank || '—') : (a.rank || '—')) + '</td>' +
      '<td class="stick">' + tagH(a.tag, true) + ' <span class="small muted">' + esc((a.name || '').slice(0, 22)) + '</span></td>' +
      '<td class="n">' + (r.g || '—') + '</td><td class="n">' + fPow(a.pw) + '</td><td class="n mono">' + fCu(a.copper) + '</td><td class="n mono">' + Math.round(a.rating) + '</td>' +
      '<td>' + pipsH(a) + '</td><td class="n wl">' + a.atkW + '–' + a.atkL + '</td><td>' + beatH(r.bA) + '</td><td class="n wl">' + a.defW + '–' + a.defL + (a.asW + a.asL ? '<span class="small muted"> +' + a.asW + '–' + a.asL + ' asst</span>' : '') + '</td><td>' + beatH(r.bD) + '</td>' +
      '<td class="n mono">' + fSigned(a.net) + '</td><td>' + flags.join(' ') + '</td></tr>';
    if (S.open === a.tag) h += '<tr class="detail"><td colspan="13">' + detailH(a) + '</td></tr>';
  }
  h += '</tbody></table></div><div class="legendrow"><span><span class="pip w" style="width:14px;height:14px">A</span> won</span><span><span class="pip" style="width:14px;height:14px">D</span> lost</span><span>A attack · D defense · S assist</span><span>Rating: 1500 is a median alliance; +200 ≈ 76% to win an even-sided fight</span></div></section>';
  return h;
}
function detailH(a){
  const log = a.log.slice().sort((x, y) => x.round - y.round);
  return '<div class="log">' + (log.length ? log.map(e => '<div class="logrow"><span class="pill">R' + e.round + '</span><span class="pip' + (e.win ? ' w' : '') + '">' + (e.role === 'atk' ? 'A' : e.role === 'def' ? 'D' : 'S') + '</span><span>' + (e.role === 'atk' ? 'Attacked' : e.role === 'def' ? 'Defended against' : 'Assisted vs') + ' ' + e.opp.map(t => tagH(t)).join(' + ') + (e.mates.length ? ' <span class="muted">with ' + e.mates.map(t => tagH(t)).join(', ') + '</span>' : '') + '</span><span class="mono">' + fSigned(e.cu) + '</span><span class="small muted">model gave attackers ' + fPct(e.p) + '</span></div>').join('') : '<span class="muted">No recorded battles.</span>') +
    '<div class="small muted">Production ' + fCu(a.g) + '/h (' + ({ set: 'set by you', known: 'from city list', measured: 'measured', fitted: 'estimated', scaled: 'estimated from economy', none: 'unknown' }[a.gSrc] || a.gSrc) + ') · economy copper ' + fCu(a.econ) + (a.notes ? ' · ' + esc(a.notes) : '') + '</div></div>';
}

/* ---------- Declare ---------- */
function renderDeclare(){
  const up = upcoming();
  if (!up.length) return '<section class="panel"><p>No upcoming rounds.</p></section>';
  if (!S.selRound || !up.find(r => r.n === S.selRound)) S.selRound = up[0].n;
  const r = up.find(x => x.n === S.selRound);
  const st = stepFor(r.n);
  const role = roleOf(r);
  const gi = S.selGroup || st.gIdx;
  const grp = st.groups.byIdx[gi];
  const groupsOpts = st.groups.list.map(g => '<option value="' + g.idx + '"' + (g.idx === gi ? ' selected' : '') + '>Group ' + g.idx + ' · ranks ' + g.range[0] + '–' + (g.range[1] >= 100 ? '100' : g.range[1]) + (g.idx === st.gIdx ? ' (ours)' : '') + '</option>').join('');
  let h = '<section class="panel"><div class="panel-h"><div><div class="eyebrow">Declaration planner</div><h2>Round ' + r.n + ' · ' + esc(serverStr(r.t, true)) + ' server · ' + esc(fname(r.atk)) + ' attacks</h2></div>' +
    '<div class="controls"><select id="selRound" aria-label="Round">' + up.map(x => '<option value="' + x.n + '"' + (x.n === r.n ? ' selected' : '') + '>Round ' + x.n + ' · ' + serverStr(x.t, true) + ' · we ' + roleOf(x) + '</option>').join('') + '</select>' +
    '<select id="selGroup" aria-label="Group">' + groupsOpts + '</select></div></div>' +
    '<p class="small muted">Group membership is projected from copper at ' + esc(serverStr(r.lockT, true)) + ' server (' + (M.cfg.lockMode === 'week' ? 'week start' : 'when declarations open') + '), including expected results of earlier rounds. Confirm it in-game; record actual declarations below and every number updates.</p></section>';
  if (!grp) return h + '<section class="panel"><p>Group not found.</p></section>';
  const sim = M.simGroup(r.n, grp, st.cuLock, (fixedByRound()[r.n]) || {});
  const cu = st.cuBattle;
  const atkF = r.atk, defF = CW.other(atkF);
  const isOurs = gi === st.gIdx;
  h += '<section class="panel"><div class="panel-h"><h3>Group ' + gi + ': ' + esc(fname(atkF)) + ' attackers vs ' + esc(fname(defF)) + ' defenders</h3></div><div class="matchup"><div class="side">' + grp[atkF].map(t => unitRow(t, cu)).join('') + '</div><div class="vs">→</div><div class="side">' + grp[defF].map(t => unitRow(t, cu, 'max plunder ' + fCu(cu[t] * M.cfg.plunderPct))).join('') + '</div></div></section>';
  if (!sim.A.length || !sim.D.length) return h + '<section class="panel"><p>This group has no one on the other side, so nobody fights here this round.</p></section>';

  // attack board
  if (role === 'attack' && isOurs && sim.attackers[us()]) {
    const A = sim.attackers[us()];
    const rows = sim.D.map(d => {
      const pairs = sim.A.filter(x => x !== us()).map(p => Object.assign({ p }, A.condPair ? A.condPair[d + '|' + p] : {})).filter(x => x.ev != null).sort((x, y) => y.ev - x.ev);
      return { d, solo: A.solo[d], cond: A.cond[d], condP: A.condP ? A.condP[d] : null, pair: pairs[0], def: M.al[d] };
    }).sort((x, y) => y.cond - x.cond);
    h += '<section class="panel"><div class="panel-h"><div><div class="eyebrow">Our options</div><h3>Where ' + tagH(us()) + ' should declare</h3></div><span class="pill cu">Best: ' + tagH(rows[0].d) + ' ' + fSigned(rows[0].cond) + '</span></div>' +
      '<div class="tbl-wrap"><table><thead><tr><th>Target</th><th class="n">Copper</th><th class="n">Max plunder</th><th>Their defense</th><th class="n">Win 1v1</th><th class="n">Win, likely pile-ups</th><th class="n">Expected for us</th><th>Best pairing</th></tr></thead><tbody>' +
      rows.map((x, i) => '<tr' + (i === 0 ? ' class="us-row"' : '') + '><td>' + tagH(x.d) + '</td><td class="n mono">' + fCu(cu[x.d]) + '</td><td class="n mono">' + fCu(cu[x.d] * M.cfg.plunderPct) + '</td><td>' + x.def.defW + '–' + x.def.defL + ' ' + beatH(beatStats(x.def.beatDef)) + '</td><td class="n">' + fPct(x.solo.P) + '</td><td class="n">' + fPct(x.condP) + '</td><td class="n mono"><b>' + fSigned(x.cond) + '</b></td><td>' + (x.pair ? 'with ' + tagH(x.pair.p) + ': win ' + fPct(x.pair.P) + ', our share ' + fPct(x.pair.share) + ', ' + fSigned(x.pair.ev) : '—') + '</td></tr>').join('') +
      '</tbody></table></div><p class="small muted">“Expected for us” = chance of winning × our share of the plunder, plus warehouse copper we usually take even when the center holds. A pairing means a faction-mate declares on the same target; the defender may then invite a free alliance from their side to assist (assumed ' + fPct(M.cfg.assistProb) + ' likely).</p></section>';
    // group plans
    if (sim.plans && sim.plans.length) {
      const byUs = sim.plans.slice().sort((x, y) => (y.ev[us()] || 0) - (x.ev[us()] || 0) || y.total - x.total).slice(0, 3);
      const byTot = sim.plans.slice().sort((x, y) => y.total - x.total).slice(0, 3);
      const planRow = p => '<tr><td>' + sim.A.map(a => tagH(a) + ' → ' + tagH(p.choice[a])).join('<br>') + '</td><td>' + Object.keys(p.res).map(d => tagH(d) + ' ' + fPct(p.res[d].P) + (p.res[d].assists.length ? ' <span class="small muted">(+' + p.res[d].assists.join(', ') + ' assist)</span>' : '')).join('<br>') + '</td><td class="n mono">' + fSigned(p.ev[us()] || 0) + '</td><td class="n mono">' + fSigned(p.total) + '</td></tr>';
      h += '<section class="panel"><div class="panel-h"><div><div class="eyebrow">Coordinate with faction-mates</div><h3>Group plans</h3></div></div><div class="grid2">' +
        '<div><div class="small muted" style="margin-bottom:6px">Best for us</div><div class="tbl-wrap"><table><thead><tr><th>Declarations</th><th>Win chance</th><th class="n">Us</th><th class="n">Our side</th></tr></thead><tbody>' + byUs.map(planRow).join('') + '</tbody></table></div></div>' +
        '<div><div class="small muted" style="margin-bottom:6px">Best for our whole side</div><div class="tbl-wrap"><table><thead><tr><th>Declarations</th><th>Win chance</th><th class="n">Us</th><th class="n">Our side</th></tr></thead><tbody>' + byTot.map(planRow).join('') + '</tbody></table></div></div>' +
        '</div><p class="small muted">Spreading out keeps every enemy busy defending, so nobody is free to assist. Doubling up on one target frees an enemy to help defend it.</p></section>';
    }
  }
  // defense board
  if (role === 'defend' && isOurs && sim.defenders[us()]) {
    const o = sim.defenders[us()];
    const L = M.loot(cu, us());
    const sc = aggScen(o.scen).slice(0, 5);
    h += '<section class="panel"><div class="panel-h"><div><div class="eyebrow">Our defense</div><h3>Who is likely to hit ' + tagH(us()) + '</h3></div><span class="pill warn">expected ' + fCu(-o.expLoss) + '</span></div>' +
      '<div class="tbl-wrap"><table><thead><tr><th>Enemy</th>' + sim.D.map(d => '<th class="n">Picks ' + esc(d) + '</th>').join('') + '<th class="n">Beats us 1v1</th><th>Their attack record</th></tr></thead><tbody>' +
      sim.A.map(e => { const a = M.al[e]; return '<tr><td>' + tagH(e) + '</td>' + sim.D.map(d => '<td class="n' + (d === us() ? '' : ' muted') + '">' + fPct(sim.attackers[e].probs[d] || 0) + '</td>').join('') + '<td class="n">' + fPct(M.pwin([e], [us()])) + '</td><td>' + a.atkW + '–' + a.atkL + ' ' + beatH(beatStats(a.beatAtk)) + '</td></tr>'; }).join('') +
      '</tbody></table></div>' +
      '<div class="grid2"><div><div class="small muted" style="margin-bottom:6px">Most likely attacks on us</div><div class="tbl-wrap"><table><thead><tr><th>Attackers</th><th>Our assist</th><th class="n">Chance</th><th class="n">They win</th></tr></thead><tbody>' +
      (sc.length ? sc.map(s => '<tr><td>' + s.attackers.map(t => tagH(t)).join(' + ') + '</td><td>' + (s.assists.length ? s.assists.map(t => tagH(t)).join(', ') : '<span class="muted">none allowed</span>') + '</td><td class="n">' + fPct(s.p) + '</td><td class="n">' + fPct(s.P) + '</td></tr>').join('') : '<tr><td colspan="4" class="muted">Nobody is expected to declare on us.</td></tr>') +
      '</tbody></table></div></div><div><dl class="kv"><dt>Declared on at all</dt><dd>' + fPct(o.pAttacked) + '</dd><dt>We lose, if declared on</dt><dd>' + fPct(o.pAttacked ? o.pLose / o.pAttacked : 0) + '</dd><dt>Center falls: we lose</dt><dd>' + fCu(-L.win) + '</dd><dt>Center holds: warehouses only</dt><dd>' + fCu(-L.loss) + '</dd></dl>' +
      '<p class="small muted" style="margin-top:8px">With 2 attackers we may invite 1 assist; with 3, up to 2. Only group-mates nobody declared on can help, and assists never lose copper.</p></div></div></section>';
  }
  // all defenders overview
  h += '<section class="panel"><div class="panel-h"><h3>Every defender in this group</h3></div><div class="tbl-wrap"><table><thead><tr><th>Defender</th><th class="n">Declared on</th><th class="n">Falls, if declared on</th><th class="n">Expected loss</th><th>Their defense</th></tr></thead><tbody>' +
    sim.D.map(d => { const o = sim.defenders[d], a = M.al[d]; return '<tr' + (d === us() ? ' class="us-row"' : '') + '><td>' + tagH(d) + '</td><td class="n">' + fPct(o.pAttacked) + '</td><td class="n">' + fPct(o.pAttacked ? o.pLose / o.pAttacked : 0) + '</td><td class="n mono">' + fCu(-o.expLoss) + '</td><td>' + a.defW + '–' + a.defL + ' ' + beatH(beatStats(a.beatDef)) + '</td></tr>'; }).join('') + '</tbody></table></div>' + (sim.exact ? '' : '<p class="small muted">Large group: estimates treat each attacker’s choice independently.</p>') + '</section>';
  // known declarations
  const fx = (fixedByRound()[r.n]) || {};
  h += '<section class="panel"><div class="panel-h"><div><div class="eyebrow">Declaration Record</div><h3>Record who declared on whom</h3></div>' + (S.canWrite ? '' : '<span class="small muted">View only</span>') + '</div>' +
    '<p class="small muted">Leave “Model guess” until you see a real declaration in-game. Locked choices replace the guesses for this round everywhere in the tool.</p><div class="form-grid">' +
    sim.A.map(a => '<label class="f">' + esc(a) + ' declares on<select data-fix="' + esc(a) + '" data-round="' + r.n + '"' + (S.canWrite ? '' : ' disabled') + '><option value="">Model guess</option>' + sim.D.map(d => '<option value="' + esc(d) + '"' + (fx[a] === d ? ' selected' : '') + '>' + esc(d) + '</option>').join('') + '<option value="none"' + (fx[a] === 'none' ? ' selected' : '') + '>No declaration</option></select></label>').join('') + '</div></section>';
  return h;
}

/* ---------- Strategy ---------- */
function renderStrategy(){
  const up = upcoming();
  const nd = up.find(r => roleOf(r) === 'defend');
  const na = up.find(r => roleOf(r) === 'attack');
  let h = '';
  if (nd) {
    const pols = [['fight', 'Declared on, we fight'], ['fold', 'Declared on, we lose on purpose'], ['hold', 'Declared on, we hold the center'], ['spared', 'Nobody declares on us']];
    const res = pols.map(([k, l]) => ({ k, l, f: forecast({ [nd.n]: k }) }));
    const fight = res[0].f, fold = res[1].f;
    const d = fold.end[us()] - fight.end[us()];
    h += '<section class="panel"><div class="panel-h"><div><div class="eyebrow">Tanking</div><h2>Should we lose round ' + nd.n + ' on purpose?</h2></div><span class="pill ' + (d > 0 ? 'good' : 'warn') + '">' + (d > 0 ? 'Folding pays ' + fCu(d) : 'Fighting pays ' + fCu(-d)) + '</span></div>' +
      '<p class="verdict">Losing a defense hands the attacker about ' + fCu(M.loot(stepFor(nd.n).cuBattle, us()).win) + ' and drops us down the ' + esc(fname(ourF())) + ' ranking, into a group with weaker enemies for the rounds after. ' + (d > 0 ? '<b>Right now the easier groups are worth more than the copper it costs.</b>' : '<b>Right now the copper we would give away is worth more than the easier groups it buys.</b>') + ' The table follows us through every remaining round.</p>' +
      '<div class="tbl-wrap"><table><thead><tr><th class="stick">Scenario</th><th class="n">End copper</th><th class="n">End rank</th>' + fight.steps.map(s => '<th>R' + s.round.n + ' · we ' + roleOf(s.round) + '</th>').join('') + '</tr></thead><tbody>' +
      res.map(x => '<tr' + (x.k === 'fight' ? ' class="us-row"' : '') + '><td class="stick">' + esc(x.l) + '</td><td class="n mono"><b>' + fCu(x.f.end[us()]) + '</b></td><td class="n">#' + x.f.endFrank + '</td>' + x.f.steps.map(s => '<td><span class="mono">' + fSigned(s.usDelta) + '</span><br><span class="small muted">grp ' + (s.gIdx || '—') + ' (#' + (s.frankLock || '—') + ') vs ' + (s.sim ? s.sim[s.sim.atkF === ourF() ? 'D' : 'A'].map(esc).join(', ') : '—') + '</span></td>').join('') + '</tr>').join('') +
      '</tbody></table></div><p class="small muted">Every alliance’s copper moves by its expected result each round, so group projections are central estimates. “Lose on purpose” only works if someone actually declares on us.</p></section>';
    // band chart for the following week
    const later = up.filter(r => r.week > nd.week);
    const atkR = later.find(r => roleOf(r) === 'attack'), defR = later.find(r => roleOf(r) === 'defend');
    if (atkR || defR) {
      const base = (fight.steps.find(s => s.round.n === (atkR || defR).n) || {}).cuLock;
      if (base) {
        const key = 'bands' + (atkR ? atkR.n : 0) + (defR ? defR.n : 0);
        const bands = memo[key] || (memo[key] = M.bandValues(atkR ? atkR.n : null, defR ? defR.n : null, base));
        const fightBand = (fight.steps.find(s => s.round.n === (atkR || defR).n) || {}).gIdx;
        const foldBand = (fold.steps.find(s => s.round.n === (atkR || defR).n) || {}).gIdx;
        h += '<section class="panel"><div class="panel-h"><div><div class="eyebrow">Week ' + (atkR || defR).week + ' · rounds ' + [atkR, defR].filter(Boolean).map(r => r.n).join(' & ') + '</div><h2>What each rank band is worth to us</h2></div></div>' +
          '<p class="small muted">Expected copper from our ' + (atkR ? 'attack in round ' + atkR.n : '') + (atkR && defR ? ' minus our expected loss defending in round ' + defR.n : defR ? 'defense in round ' + defR.n : '') + ', if we sat in each ' + esc(fname(ourF())) + ' rank band. Taller is better.</p>' +
          bandChart(bands, fightBand, foldBand) +
          '<details><summary>Table view</summary><div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>Band</th><th>Enemies</th><th class="n">Our copper there</th><th class="n">Attack</th><th class="n">Defense</th><th class="n">Net</th></tr></thead><tbody>' +
          bands.map(b => '<tr' + (b.band === fightBand ? ' class="us-row"' : '') + '><td>' + b.lo + '–' + (b.hi >= 100 ? '100' : b.hi) + '</td><td>' + b.enemies.slice(0, 4).map(t => tagH(t)).join(' ') + (b.enemies.length > 4 ? ' +' + (b.enemies.length - 4) : '') + '</td><td class="n mono">' + fCu(b.cuLevel) + '</td><td class="n mono">' + fSigned(b.atkEV) + '</td><td class="n mono">' + fCu(-b.defLoss) + '</td><td class="n mono"><b>' + fSigned(b.value) + '</b></td></tr>').join('') +
          '</tbody></table></div></details></section>';
      }
    }
  }
  if (na) {
    const st = stepFor(na.n);
    if (st && st.sim && st.sim.attackers[us()]) {
      const sim = st.sim, A = sim.attackers[us()];
      const mates = sim.A.filter(x => x !== us());
      let bestSolo = -Infinity, bestPair = { ev: -Infinity };
      for (const d of sim.D) { bestSolo = Math.max(bestSolo, A.cond[d]); for (const p of mates) { const c = A.condPair && A.condPair[d + '|' + p]; if (c && c.ev > bestPair.ev) bestPair = Object.assign({ d, p }, c); } }
      h += '<section class="panel"><div class="panel-h"><div><div class="eyebrow">Round ' + na.n + ' · double declarations</div><h2>Is a 2v2 ever worth it?</h2></div><span class="pill ' + (bestPair.ev > bestSolo ? 'good' : 'warn') + '">' + (bestPair.ev > bestSolo ? 'Pair up' : 'Go solo') + '</span></div>' +
        '<p class="verdict">' + (bestPair.ev > bestSolo ? 'Pairing with ' + tagH(bestPair.p) + ' on ' + tagH(bestPair.d) + ' is worth ' + fSigned(bestPair.ev) + ' to us vs ' + fSigned(bestSolo) + ' for our best solo declaration.' : 'Our best solo declaration (' + fSigned(bestSolo) + ') beats our best pairing (' + (isFinite(bestPair.ev) ? fSigned(bestPair.ev) + ', with ' + tagH(bestPair.p) + ' on ' + tagH(bestPair.d) : 'none available') + '). A second attacker raises the odds a little, but the loot splits by damage and the defender gets to invite a free ally.') + '</p>' +
        '<div class="tbl-wrap"><table><thead><tr><th>Target</th><th class="n">Solo</th>' + mates.map(p => '<th class="n">With ' + esc(p) + '</th>').join('') + '</tr></thead><tbody>' +
        sim.D.map(d => '<tr><td>' + tagH(d) + '</td><td class="n"><span class="mono">' + fSigned(A.cond[d]) + '</span><br><span class="small muted">win ' + fPct(A.condP ? A.condP[d] : null) + '</span></td>' + mates.map(p => { const c = A.condPair && A.condPair[d + '|' + p]; return '<td class="n">' + (c ? '<span class="mono">' + fSigned(c.ev) + '</span><br><span class="small muted">win ' + fPct(c.P) + ' · share ' + fPct(c.share) + '</span>' : '—') + '</td>'; }).join('') + '</tr>').join('') +
        '</tbody></table></div><p class="small muted">When it can flip: a target far stronger than any one of us, rich enough that half the plunder still beats a solo hit elsewhere, and no free enemy left to assist it (every other enemy in the group already declared on).</p></section>';
    }
  }
  // soft defenses
  const soft = M.battles.filter(b => b.winner === 'A' && b.pAtk < 0.35);
  const held = M.battles.filter(b => b.winner === 'D' && b.pAtk > 0.75);
  h += '<section class="panel"><div class="panel-h"><div><div class="eyebrow">Possible tanking by others</div><h3>Defenses that fell when they should have held</h3></div></div>' +
    (soft.length ? '<div class="tbl-wrap"><table><thead><tr><th>Round</th><th>Defender</th><th>Attackers</th><th class="n">Model gave attackers</th><th class="n">Copper lost</th></tr></thead><tbody>' + soft.map(b => '<tr><td>R' + b.round + '</td><td>' + b.defenders.map((x, i) => tagH(x.tag) + (i ? ' <span class="small muted">assist</span>' : '')).join(' ') + '</td><td>' + b.attackers.map(x => tagH(x.tag)).join(' + ') + '</td><td class="n">' + fPct(b.pAtk) + '</td><td class="n mono">' + fCu(-b.defenders[0].cu) + '</td></tr>').join('') + '</tbody></table></div>' : '<p class="muted">None so far.</p>') +
    '<p class="small muted">A single upset is usually just a bad day. Watch for an alliance that keeps losing defenses it should hold while sliding toward a softer group. ' + held.length + ' attacks failed despite strong odds, which is normal variance.</p></section>';
  // assumptions
  const c = M.cfg;
  h += '<section class="panel" id="how"><div class="panel-h"><h3>How the numbers work</h3></div><ul class="plain small">' +
    '<li><b>Groups.</b> Each faction is ranked by copper on its own. Week ' + Object.entries(c.weekSizes).map(([w, s]) => w + ': bands of ' + s).join(', week ') + ' up to rank ' + (c.poolFrom - 1) + '; ranks ' + c.poolFrom + '–100 share one pool. Same band fights same band.</li>' +
