    // Faction Duel (Sunday): one Tenryu Castle (Capitol) and three Giant Cannons; the warzone assigned to each area
    duel: { at: '2026-10-25 12:00', points: [], areas: [
      { name: 'Tenryū Castle', value: 10e6, blue: 1605, red: 1600, lead: true },
      { name: 'Giant Cannon (E)', value: 6.5e6, blue: 1593, red: 1596 },
      { name: 'Giant Cannon (NW)', value: 6.5e6, blue: 1601, red: 1615 },
      { name: 'Giant Cannon (SW)', value: 6.5e6, blue: 1632, red: 1629 } ] },
    lootAuto: true,
    assistProb: 0.6,
    choiceTemp: 30000,
    knownRates: { QIET: 2800 },
    settle: { date: '2026-10-26', time: '00:00' },
    seasonTiers: [[1, 1], [2, 3], [4, 10], [11, 20], [21, 50], [51, 80], [81, 120], [121, 999]],
    model: { auto: true, beta: 0, lin: 100, gamma: 300, H: 0, K: 240 },
    factions: {
      red: { name: 'Kage no Sato', zones: [1596, 1600, 1615, 1629] },
      blue: { name: 'Koubutai', zones: [1593, 1601, 1605, 1632] }
    },
    rounds: [
      { n: 1, date: '2026-09-30', atk: 'red' },
      { n: 2, date: '2026-10-03', atk: 'blue' },
      { n: 3, date: '2026-10-07', atk: 'blue' },
      { n: 4, date: '2026-10-10', atk: 'red' },
      { n: 5, date: '2026-10-14', atk: 'blue' },
      { n: 6, date: '2026-10-17', atk: 'red' },
      { n: 7, date: '2026-10-21', atk: 'red' },
      { n: 8, date: '2026-10-24', atk: 'blue' }

  };

  const other = f => (f === 'red' ? 'blue' : 'red');
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  const median = a => { const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length ? (s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2) : 0; };
  const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));

  function mergeCfg(c) {
    const out = JSON.parse(JSON.stringify(DEFAULT_CFG));
    if (!c) return out;
    for (const k of Object.keys(c)) {
      if (c[k] && typeof c[k] === 'object' && !Array.isArray(c[k]) && out[k] && typeof out[k] === 'object' && !Array.isArray(out[k])) out[k] = Object.assign(out[k], c[k]);

    }

  }

  // server-time helpers: a "server date" string + hh:mm → UTC ms
  function serverToUtc(cfg, dateStr, hhmm) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const [hh, mm] = (hhmm || '00:00').split(':').map(Number);
    return Date.UTC(y, m - 1, d, hh, mm) - cfg.serverUtcOffset * HOUR;
  }

  function build(rawAlliances, rawBattles, rawCfg, opts) {
    opts = opts || {};
    const cfg = mergeCfg(rawCfg);
    const now = opts.now || Date.now();
    const al = {};
    for (const a of rawAlliances) {
      if (!a || !a.tag) continue;
      al[a.tag] = Object.assign({}, a, {
        faction: a.faction || (cfg.factions.red.zones.includes(+a.warzone) ? 'red' : 'blue'),
        copper: +a.copper || 0,
        copperAt: a.copperAt ? Date.parse(a.copperAt) : now,
        hist: Array.isArray(a.hist) ? a.hist.map(h => ({ at: Date.parse(h.at), cu: +h.cu, exact: h.exact !== false })).filter(h => isFinite(h.at)) : []
      });
    }
    // battles
    const roundsByN = {};
    cfg.rounds.forEach(r => { roundsByN[r.n] = r; });
    const battles = rawBattles.filter(b => b && !b.deleted && Array.isArray(b.attackers) && Array.isArray(b.defenders) && b.attackers.length && b.defenders.length)
      .map(b => {
        const r = roundsByN[b.round];
        const date = b.date || (r && r.date);
        return Object.assign({}, b, { date, t: date ? serverToUtc(cfg, date, cfg.battleTime) : 0 });
      })
      .sort((x, y) => x.round - y.round || String(x.id).localeCompare(String(y.id)));
    // make sure every tag in battles exists
    for (const b of battles) for (const p of b.attackers.concat(b.defenders)) {
      if (!al[p.tag]) al[p.tag] = { tag: p.tag, name: p.tag, faction: b.atkFaction ? (b.attackers.includes(p) ? b.atkFaction : other(b.atkFaction)) : 'red', copper: 0, copperAt: now, hist: [], unknown: true };
    }
    const tags = Object.keys(al);
    // net battle copper + econ
    for (const t of tags) { al[t].net = 0; al[t].netRead = 0; }
    for (const b of battles) {
      for (const p of b.defenders) { al[p.tag].net -= (+p.cu || 0); if (b.t <= al[p.tag].copperAt) al[p.tag].netRead -= (+p.cu || 0); }
      for (const p of b.attackers) { al[p.tag].net += (+p.cu || 0); if (b.t <= al[p.tag].copperAt) al[p.tag].netRead += (+p.cu || 0); }
    }
    for (const t of tags) al[t].econ = Math.max(al[t].copper - al[t].netRead, 1000);

    // ranks (overall and faction), excluding inactive
    const active = tags.filter(t => !al[t].inactive && !al[t].unknown);
    const overall = [...active].sort((a, b) => al[b].copper - al[a].copper);
    overall.forEach((t, i) => { al[t].rank = i + 1; });
    for (const f of ['red', 'blue']) {
      active.filter(t => al[t].faction === f).sort((a, b) => al[b].copper - al[a].copper).forEach((t, i) => { al[t].frank = i + 1; });
    }

    // power: known or imputed from econ (log-log regression)
    const known = tags.filter(t => +al[t].power > 0);
    let pb0 = -9.41, pb1 = 0.845;
    if (known.length >= 5) {
      const xs = known.map(t => Math.log(al[t].econ)), ys = known.map(t => Math.log(+al[t].power));
      const mx = sum(xs) / xs.length, my = sum(ys) / ys.length;
      const sxx = sum(xs.map(x => (x - mx) ** 2));
      if (sxx > 0) { pb1 = sum(xs.map((x, i) => (x - mx) * (ys[i] - my))) / sxx; pb0 = my - pb1 * mx; }
    }
    for (const t of tags) {
      const a = al[t];
      if (+a.power > 0) { a.pw = +a.power; a.pwImputed = false; }
      else { a.pw = Math.exp(pb0 + pb1 * Math.log(a.econ)); a.pwImputed = true; }
    }

    // growth per hour: measured from exact history pairs, else fitted
    const battleNetBetween = (tag, t1, t2) => {
      let n = 0;
      for (const b of battles) {
        if (b.t <= t1 || b.t > t2) continue;
        for (const p of b.defenders) if (p.tag === tag) n -= (+p.cu || 0);
        for (const p of b.attackers) if (p.tag === tag) n += (+p.cu || 0);
      }
      return n;
    };
    const measured = [];
    for (const t of tags) {
      const a = al[t];
      const h = a.hist.filter(x => x.exact).sort((x, y) => x.at - y.at);
      // production between consecutive readings (battle copper removed); the latest interval is the current
      // rate, so an alliance that gives up cities shows up as soon as a new reading comes in
      const iv = [];
      for (let j = h.length - 1; j > 0; j--) {
        let i = j - 1; while (i > 0 && (h[j].at - h[i].at) / HOUR < 6) i--;
        const dh = (h[j].at - h[i].at) / HOUR; if (dh < 0.75) continue;
        iv.push({ from: h[i].at, to: h[j].at, dh, g: (h[j].cu - h[i].cu - battleNetBetween(t, h[i].at, h[j].at)) / dh });
        j = i + 1;
      }
      if (iv.length) {
        const cur = iv[0], prev = iv[1];
        a.rateHist = iv.slice().reverse();
        a.growthMeasured = Math.max(0, cur.g);
        if (prev && prev.g > 500 && cur.g < prev.g * 0.6 && prev.g - cur.g > 400) a.rateDrop = { from: prev.g, to: Math.max(0, cur.g), since: cur.from, until: cur.to };
        if (prev && cur.g > prev.g * 1.4 && cur.g - prev.g > 400) a.rateRise = { from: prev.g, to: cur.g, since: cur.from, until: cur.to };
        if (cur.g > 0) measured.push([a.econ, cur.g]);
      }
      if (cfg.knownRates && cfg.knownRates[t]) measured.push([a.econ, cfg.knownRates[t]]);
    }
    let gk = 1, ga = null;
    if (measured.length >= 3) {
      const xs = measured.map(m => Math.log(m[0])), ys = measured.map(m => Math.log(m[1]));
      const mx = sum(xs) / xs.length, my = sum(ys) / ys.length;
      const sxx = sum(xs.map(x => (x - mx) ** 2));
      if (sxx > 0) { gk = clamp(sum(xs.map((x, i) => (x - mx) * (ys[i] - my))) / sxx, 0.5, 2.5); ga = my - gk * mx; }
    }
    const usTag = cfg.us;
    for (const t of tags) {
      const a = al[t];
      if (+a.growth > 0) { a.g = +a.growth; a.gSrc = 'set'; }
      else if (cfg.knownRates && cfg.knownRates[t]) { a.g = +cfg.knownRates[t]; a.gSrc = 'known'; }
      else if (a.growthMeasured != null && a.rateHist) { a.g = a.growthMeasured; a.gSrc = 'measured'; }
      else if (ga !== null && measured.length >= 6) { a.g = Math.exp(ga + gk * Math.log(a.econ)); a.gSrc = 'fitted'; }
      else if (al[usTag] && cfg.knownRates && cfg.knownRates[usTag]) { a.g = cfg.knownRates[usTag] * a.econ / al[usTag].econ; a.gSrc = 'scaled'; }
      else { a.g = 0; a.gSrc = 'none'; }
    }

    // ---- calibrate production to in-game faction totals ----
    const factionCal = {};
    const facReads = (Array.isArray(cfg.factionTotals) ? cfg.factionTotals : []).map(r => ({ at: Date.parse(r.at), red: +r.red, blue: +r.blue })).filter(r => isFinite(r.at));
    const fixedSrc = a => a.gSrc === 'set' || a.gSrc === 'known' || a.gSrc === 'measured';
    for (const f of ['red', 'blue']) {
      const ts = tags.filter(t => al[t].faction === f && !al[t].unknown);
      const latest = facReads.filter(r => r[f] > 0).sort((x, y) => y.at - x.at)[0];
      factionCal[f] = latest ? { reading: latest[f], at: latest.at, scale: null } : null;
      let best = null;
      for (const r of facReads) {
        if (!(r[f] > 0)) continue;
        let base = 0, fixedG = 0, scal = 0, gScal = 0;
        for (const t of ts) {
          const a = al[t]; const dh = (r.at - a.copperAt) / HOUR;
          base += a.copper + (dh > 0 ? battleNetBetween(t, a.copperAt, r.at) : 0);
          if (fixedSrc(a)) fixedG += a.g * dh; else { scal += a.g * dh; gScal += a.g; }
        }
        if (!(gScal > 0) || scal / gScal < 0.5) continue;
        const sc = (r[f] - base - fixedG) / scal;
        if (!best || scal > best.scal) best = { r, sc, scal };
      }
      if (best && isFinite(best.sc)) {
        const sc = clamp(best.sc, 0.3, 3);
        for (const t of ts) { const a = al[t]; if (!fixedSrc(a)) { a.g *= sc; a.gSrc = a.gSrc + '+cal'; } }
        factionCal[f] = Object.assign(factionCal[f] || {}, { scale: sc, calAt: best.r.at, rate: ts.reduce((s2, t) => s2 + al[t].g, 0) });
      } else if (factionCal[f]) factionCal[f].rate = ts.reduce((s2, t) => s2 + al[t].g, 0);
    }

    // ---- rating model ----
    const medP = median(tags.map(t => al[t].pw));
    const medE = median(tags.map(t => al[t].econ));
    const rounds = [...new Set(battles.map(b => b.round))].sort((a, b) => a - b);
    function runModel(p, record) {
      const R = {};
      // member power counts both as a ratio (beta, log scale) and as an absolute gap (lin, rating points per G):
      // big absolute gaps between strong alliances decide fights more than a ratio alone implies
      for (const t of tags) R[t] = 1500 + p.beta * Math.log(al[t].pw / medP) + (p.lin || 0) * (al[t].pw - medP) + p.gamma * Math.log(al[t].econ / medE);
      let ll = 0, n = 0, acc = 0;
      const h = Math.pow(10, p.H / 400);
      for (const r of rounds) {
        const pr = [];
        for (const b of battles) {
          if (b.round !== r) continue;
          const sa = sum(b.attackers.map(x => Math.pow(10, R[x.tag] / 400))) * h;
          const sd = sum(b.defenders.map(x => Math.pow(10, R[x.tag] / 400)));
          const P = sa / (sa + sd), o = b.winner === 'A' ? 1 : 0;
          const Pc = clamp(P, 0.001, 0.999);
          ll += -(o * Math.log(Pc) + (1 - o) * Math.log(1 - Pc)); n++; acc += ((P > 0.5) === (o === 1)) ? 1 : 0;
          pr.push([b, P, o]);
          if (record) b.pAtk = P;
        }
        for (const [b, P, o] of pr) {
          for (const x of b.attackers) R[x.tag] += p.K * (o - P);
          for (const x of b.defenders) R[x.tag] -= p.K * (o - P);
        }
      }
      return { R, ll: n ? ll / n : 0, n, acc };
    }
    let params = Object.assign({}, cfg.model);
    if (cfg.model.auto && battles.length >= 10) {
      let best = null;
      for (const beta of [0, 200, 400, 800]) for (const lin of [0, 30, 60, 100, 130]) for (const gamma of [0, 150, 300, 450]) for (const H of [0, 30, 60]) for (const K of [80, 120, 180, 240, 300]) {
        const r = runModel({ beta, lin, gamma, H, K }, false);
        // tiny penalty keeps parameters away from the extremes when the fit is flat
        const score = r.ll + 0.002 * (Math.abs(beta - 200) / 100 + Math.abs(lin - 60) / 40 + Math.abs(gamma - 200) / 100 + Math.abs(K - 180) / 60);
        if (!best || score < best.score) best = { score, beta, lin, gamma, H, K };
      }
      params = { auto: true, beta: best.beta, lin: best.lin, gamma: best.gamma, H: best.H, K: best.K };
    }
    const fit = runModel(params, true);
    const R = fit.R;
    for (const t of tags) al[t].rating = R[t];
    const hEdge = Math.pow(10, params.H / 400);
    const str = t => Math.pow(10, (R[t] || 1500) / 400);

    // ---- per-alliance stats ----
    for (const t of tags) Object.assign(al[t], { atkW: 0, atkL: 0, defW: 0, defL: 0, asW: 0, asL: 0, cuWon: 0, cuLost: 0, beatAtk: [], beatDef: [], log: [], upsetLosses: 0 });
    for (const b of battles) {
      const aWin = b.winner === 'A';
      const prim = b.defenders[0].tag;
      for (const x of b.attackers) {
        const a = al[x.tag];
        if (aWin) { a.atkW++; a.beatAtk.push(prim); } else a.atkL++;
        a.cuWon += (+x.cu || 0);
        a.log.push({ id: b.id, round: b.round, role: 'atk', win: aWin, cu: +x.cu || 0, opp: b.defenders.map(d => d.tag), mates: b.attackers.filter(y => y !== x).map(y => y.tag), p: b.pAtk });
      }
      b.defenders.forEach((x, i) => {
        const a = al[x.tag];
        const isAssist = i > 0;
        if (isAssist) { if (aWin) a.asL++; else { a.asW++; } }
        else if (aWin) a.defL++; else { a.defW++; }
        if (!aWin) b.attackers.forEach(y => a.beatDef.push(y.tag));
        a.cuLost += (+x.cu || 0);
        if (!isAssist && aWin && b.pAtk < 0.3) a.upsetLosses++;
        a.log.push({ id: b.id, round: b.round, role: isAssist ? 'assist' : 'def', win: !aWin, cu: -(+x.cu || 0), opp: b.attackers.map(y => y.tag), mates: b.defenders.filter(y => y !== x).map(y => y.tag), p: b.pAtk });
      });
    }

    // ---- schedule ----
    const w1 = serverToUtc(cfg, cfg.week1Start, '00:00');
    const schedule = cfg.rounds.map(r => {
      const t = serverToUtc(cfg, r.date, cfg.battleTime);
      const week = Math.floor((t - w1) / (7 * 24 * HOUR)) + 1;
      const weekStart = w1 + (week - 1) * 7 * 24 * HOUR;
      const decl = t - cfg.declLeadHours * HOUR;
      return Object.assign({}, r, { t, week, weekStart, decl, lockT: cfg.lockMode === 'week' ? weekStart : decl, played: battles.some(b => b.round === r.n) });
    });

    const M = { focus: cfg.us, cfg, al, tags, battles, params, fit: { ll: fit.ll, n: fit.n, acc: fit.acc }, R, schedule, now, medP, medE, growthFit: { k: gk, a: ga, n: measured.length }, factionCal };

    M.pwin = function (att, def, assists, assistW) {
      const sa = sum(att.map(str)) * hEdge;
      const sd = sum(def.map(str)) + (assists ? sum(assists.map(str)) * (assistW == null ? 1 : assistW) : 0);
      return sa / (sa + sd);
    };
    M.str = str;

    // copper map projected to time T (ms). base = map of extra deltas already applied
    // production between two times; a scenario plan (opts.ratePlan) can switch an alliance's rate on and off
    const plans = opts.ratePlan || {};
    const prod = (t, t1, t2) => {
      const a = al[t], pl = plans[t];
      if (!pl || !pl.length) return a.g * (t2 - t1) / HOUR;
      const pts = [[-Infinity, a.g]].concat(pl.slice().sort((x, y) => x[0] - y[0]));
      let tot = 0;
      for (let i = 0; i < pts.length; i++) { const s0 = Math.max(t1, pts[i][0]), e0 = Math.min(t2, i + 1 < pts.length ? pts[i + 1][0] : Infinity); if (e0 > s0) tot += pts[i][1] * (e0 - s0) / HOUR; }
      return tot;
    };
    M.prod = prod;
    // copper an alliance held at time T, rebuilt from its latest reading, production and recorded battles
    const backOne = (t, T) => {
      const a = al[t]; let c = a.copper - prod(t, T, a.copperAt);
      for (const b of battles) { if (b.t <= T || b.t > a.copperAt) continue; for (const p of b.defenders) if (p.tag === t) c += (+p.cu || 0); for (const p of b.attackers) if (p.tag === t) c -= (+p.cu || 0); }
      return c;
    };
    const postB = {};
    for (const t of tags) postB[t] = [];
    for (const b of battles) {
      for (const p of b.defenders) if (b.t > al[p.tag].copperAt) postB[p.tag].push([b.t, -(+p.cu || 0)]);
      for (const p of b.attackers) if (b.t > al[p.tag].copperAt) postB[p.tag].push([b.t, +p.cu || 0]);
    }
    M.project = function (T, deltas) {
      const out = {};
      for (const t of tags) {
        const a = al[t];
        let c;
        if (T >= a.copperAt) {
          c = a.copper + prod(t, a.copperAt, T);
          for (const [bt, v] of postB[t]) if (bt <= T) c += v;
        } else c = backOne(t, T); // a reading taken after T: run production and battles backwards
        out[t] = c + ((deltas && deltas[t]) || 0);
      }
      return out;
    };
    // current ranks come from estimated copper now (last reading + production + recorded battles since)
    {
      const cuNow = M.project(now);
      for (const t of tags) al[t].cuNow = cuNow[t];
      [...active].sort((a, b) => cuNow[b] - cuNow[a]).forEach((t, i) => { al[t].rank = i + 1; });
      for (const f of ['red', 'blue']) active.filter(t => al[t].faction === f).sort((a, b) => cuNow[b] - cuNow[a]).forEach((t, i) => { al[t].frank = i + 1; });
    }
    M.factionOrder = function (cu, faction) {
      return tags.filter(t => al[t].faction === faction && !al[t].inactive && !al[t].unknown).sort((a, b) => cu[b] - cu[a]);
    };
    M.groupIdx = function (frank, week) {
      const s = cfg.weekSizes[week] || cfg.weekSizes[Math.max(...Object.keys(cfg.weekSizes).map(Number))];
      const capGroups = Math.floor((cfg.poolFrom - 1) / s);
      if (frank >= cfg.poolFrom) return capGroups + 1;
      return Math.floor((frank - 1) / s) + 1;
    };
    M.groupRange = function (idx, week) {
      const s = cfg.weekSizes[week] || 3;
      const capGroups = Math.floor((cfg.poolFrom - 1) / s);
      if (idx > capGroups) return [cfg.poolFrom, 100];
      return [(idx - 1) * s + 1, idx * s];
    };
    M.groupsAt = function (cu, week) {
      const ord = { red: M.factionOrder(cu, 'red'), blue: M.factionOrder(cu, 'blue') };
      const groups = {};
      for (const f of ['red', 'blue']) ord[f].forEach((t, i) => {
        const g = M.groupIdx(i + 1, week);
        (groups[g] = groups[g] || { idx: g, red: [], blue: [], range: M.groupRange(g, week) })[f].push(t);
      });
      const franks = {};
      for (const f of ['red', 'blue']) ord[f].forEach((t, i) => { franks[t] = i + 1; });
      return { list: Object.values(groups).sort((a, b) => a.idx - b.idx), byIdx: groups, franks, ord };
    };

    const backcast = T => { const out = {}; for (const t of tags) out[t] = backOne(t, T); return out; };

    // ---- loot actually taken, measured from the battle record ----
    // Share of the defender's max plunder that changed hands, split by whether the alliance center fell.
    // A held center can still lose buildings; a fallen center can keep some.
    const lootFit = (() => {
      const fell = [], held = [], rows = [];
      for (const b of battles) {
        const d = b.defenders && b.defenders[0];
        if (!d || !al[d.tag] || al[d.tag].unknown || d.cu == null || d.cu === '') continue;
        const rr = schedule.find(x => x.n === b.round);
        const c0 = backOne(d.tag, rr && rr.lockT < b.t ? rr.lockT : b.t - 1); const mx = c0 * cfg.plunderPct; if (!(mx > 0)) continue;
        const fr = clamp((+d.cu || 0) / mx, 0, 1.2);
        (b.winner === 'A' ? fell : held).push(fr);
        rows.push({ id: b.id, round: b.round, def: d.tag, won: b.winner === 'A', frac: fr, P: b.pAtk });
      }
      const mean = a => a.length ? sum(a) / a.length : null;

    // usPolicy: {roundN: 'hold'|'fold'|'model'|targetTag}
    M.forecast = function (usPolicy, fixedByRound) {
      usPolicy = usPolicy || {};
      const us = M.focus || cfg.us;
      const upcoming = schedule.filter(r => !r.played && r.t > now);
      let extra = {}; // accumulated expected battle deltas
      const steps = [];
      for (const r of upcoming) {
        const cuLock = M.project(r.lockT, extra);
        const cuBattle = M.project(r.t, extra);
        const sr = M.simRound(r.n, cuLock, fixedByRound);
        // use battle-time copper for loot sizes: rescale deltas by ratio (approx)
        const gIdx = sr.groups.franks[us] ? M.groupIdx(sr.groups.franks[us], r.week) : null;
        const sim = gIdx ? sr.sims[gIdx] : null;
        const deltas = Object.assign({}, sr.deltas);
        let usDelta = deltas[us] || 0, note = 'model';
        const pol = usPolicy[r.n];
        if (sim && pol && pol !== 'model') {
          if (sim.D.includes(us)) {
            // conditional on being declared on
            const o = sim.defenders[us];
            const pl = o.pAttacked ? o.pLose / o.pAttacked : 0.5; const L = loot(cuLock, us, pl);
            if (pol === 'fold') { usDelta = -L.win; note = 'declared on, we fold'; }
            if (pol === 'hold') { usDelta = -L.loss; note = 'declared on, we hold'; }

      const end = M.project((upcoming.length ? upcoming[upcoming.length - 1].t : now) + 1, extra);
      const endOrder = M.factionOrder(end, al[us] ? al[us].faction : 'red');
      return { steps, end, endFrank: endOrder.indexOf(us) + 1, endOverall: [...tags].filter(t => !al[t].inactive && !al[t].unknown).sort((a, b) => end[b] - end[a]).indexOf(us) + 1, extra };
    };

    // value of each rank band for one attack round + one defense round in the same week
    // Coordinated declarations for a set of friendly alliances ("zone") inside one group.
    // Zone attackers are assigned jointly; every other attacker follows the choice model.
    M.zonePlans = function (roundN, group, cu, zone, indiv) {
      const r = schedule.find(x => x.n === roundN);
      const atkF = r.atk, defF = other(atkF);
      const A = group[atkF] || [], D = group[defF] || [];
      const Z = A.filter(t => zone.includes(t));

      let combos = [];

      if (nCombos <= 729) {
        const rec = (i, ch, p) => { if (i === others.length) { combos.push([Object.assign({}, ch), p]); return; } for (const [d, q] of probs[others[i]]) { ch[others[i]] = d; rec(i + 1, ch, p * q); } delete ch[others[i]]; };

      } else {
        const rnd = mulberry32(12345);
        for (let k = 0; k < 160; k++) { const ch = {}; for (const o of others) { let u = rnd(), acc = 0; for (const [d, q] of probs[o]) { acc += q; if (u <= acc) { ch[o] = d; break; } } if (!ch[o]) ch[o] = probs[o][probs[o].length - 1][0]; } combos.push([ch, 1 / 160]); }
      }
      const evalAssign = asg => {
        const ev = {}, P = {}, share = {}; let tot = 0;
        for (const z of Z) { ev[z] = 0; P[z] = 0; share[z] = 0; }
        for (const [ch, p] of combos) {
          const full = Object.assign({}, ch, asg);
          const { ev: e, res } = resolve(A, D, full, cu, cfg.assistProb);
          for (const z of Z) { ev[z] += p * (e[z] || 0); const t = asg[z]; if (t && res[t]) { P[z] += p * res[t].P; share[z] += p * str(z) / sum(res[t].attackers.map(str)); } }

      };

      const rec = (i, asg) => { if (i === Z.length) { plans.push(evalAssign(asg)); return; } for (const d of opts[i]) { asg[Z[i]] = d; rec(i + 1, asg); } delete asg[Z[i]]; };

    // Monte Carlo of the rest of the season: sampled declarations and win/loss outcomes for every

    M.seasonSim = function (n, opts) {
      opts = opts || {};
      const st = cfg.settle || { date: '2026-10-26', time: '00:00' };

      const upcoming = schedule.filter(r => !r.played && r.t > now && r.t < settleT);
      const fixedBy = opts.fixed || {};

          const fixed = fixedBy[r.n] || {};
          for (const g of gs.list) {
            const A = g[atkF], D = g[defF];

            for (const a of A) {
              if (fixed[a]) { if (fixed[a] !== 'none' && D.includes(fixed[a])) choice[a] = fixed[a]; continue; }
              const p = M.choiceProbs(a, D, cuLock);

      const q = (arr, p) => { const a = arr.slice().sort((x, y) => x - y); if (!a.length) return NaN; const i = Math.min(a.length - 1, Math.max(0, Math.round(p * (a.length - 1)))); return a[i]; };

      const cur = active.slice().sort((x, y) => al[y].cuNow - al[x].cuNow);

        const mean = cs.reduce((s, x) => s + x, 0) / cs.length;
        out[t] = { tag: t, faction: facOf(t), cuMean: mean, cuLo: q(cs, 0.1), cuHi: q(cs, 0.9), rankMed: q(rs, 0.5), rankLo: q(rs, 0.1), rankHi: q(rs, 0.9), rankMean: rs.reduce((s, x) => s + x, 0) / rs.length, tierP, tierBest: tierP.indexOf(Math.max(...tierP)), nowRank: cur.indexOf(t) + 1 };
      }
      const curTot = { red: 0, blue: 0 };
      const nowCu = M.project(now);
      for (const t of tags) if (!al[t].unknown) curTot[facOf(t)] += nowCu[t];
      const mean = a => a.reduce((s, x) => s + x, 0) / Math.max(1, a.length);
      return { n, settleT, rounds: upcoming.map(r => r.n), tiers, alliances: out,
        faction: { pRed: n ? redWins / n : (curTot.red > curTot.blue ? 1 : 0), red: { now: curTot.red, mean: mean(fac.red), lo: q(fac.red, 0.1), hi: q(fac.red, 0.9) }, blue: { now: curTot.blue, mean: mean(fac.blue), lo: q(fac.blue, 0.1), hi: q(fac.blue, 0.9) },

    // Where we could land for round `targetN`: sample every group's declarations and results in the rounds

    // Results are bucketed by what happened to us in the last of those rounds.
    M.roundScenarios = function (targetN, n, opts) {

      const last = before[before.length - 1];
      const ourF = al[us].faction, prevRole = last.atk === ourF ? 'attack' : 'defend';
      const fixedBy = opts.fixed || {};
      const rnd = mulberry32(opts.seed || 1017);
      const comps = {}, outs = {};
      for (let s = 0; s < n; s++) {
        const extra = {}; let ourOut = prevRole === 'attack' ? 'none' : 'spared';
        for (const r of before) {
          const cuLock = M.project(r.lockT, extra);
          const gs = M.groupsAt(cuLock, r.week); const atkF = r.atk, defF = other(atkF); const fixed = fixedBy[r.n] || {};
          for (const g of gs.list) {
            const A = g[atkF], D = g[defF];
            if (!A.length || !D.length) continue;
            const choice = {};
            for (const a of A) {
              if (fixed[a]) { if (fixed[a] !== 'none' && D.includes(fixed[a])) choice[a] = fixed[a]; continue; }
              const p = M.choiceProbs(a, D, cuLock);
              let u = rnd(), acc = 0, pick = D[D.length - 1];
              for (let i = 0; i < D.length; i++) { acc += p[i]; if (u <= acc) { pick = D[i]; break; } }
              choice[a] = pick;
            }
            const { res } = resolve(A, D, choice, cuLock, cfg.assistProb);
            for (const d of Object.keys(res)) {
              const RR = res[d]; const won = rnd() < RR.P; const amt = lootDraw(rnd, cuLock, d, won, RR.P);
              extra[d] = (extra[d] || 0) - amt;
              const tot = sum(RR.attackers.map(str));
              for (const a of RR.attackers) extra[a] = (extra[a] || 0) + amt * str(a) / tot;
              if (r === last && d === us) ourOut = won ? 'fell' : (amt > 0.01 * cuLock[d] * cfg.plunderPct ? 'partial' : 'clean');
              if (r === last && RR.attackers.includes(us)) ourOut = won ? 'won' : 'failed';
            }

        }
        const cuL = M.project(R.lockT, extra);
        const gs = M.groupsAt(cuL, R.week);
        const fr = gs.franks[us]; const gi = fr ? M.groupIdx(fr, R.week) : null; const grp = gi ? gs.byIdx[gi] : null;
        const key = gi + '|' + (grp ? grp[R.atk].join(',') + '>' + grp[other(R.atk)].join(',') : '');
        const c = comps[key] || (comps[key] = { key, gi, group: grp, n: 0, cuSum: {}, outs: {}, frSum: 0 });
        c.n++; c.frSum += fr || 0; c.outs[ourOut] = (c.outs[ourOut] || 0) + 1;
        if (grp) for (const t of [...grp.red, ...grp.blue]) c.cuSum[t] = (c.cuSum[t] || 0) + cuL[t];
        const o = outs[ourOut] || (outs[ourOut] = { out: ourOut, n: 0, comps: {} });
        o.n++; o.comps[key] = (o.comps[key] || 0) + 1;
      }
      const base = M.project(R.lockT);
      const list = Object.values(comps).sort((a, b) => b.n - a.n);
      list.forEach(c => {
        c.p = c.n / n; c.frank = c.frSum / c.n;
        if (!c.group) return;
        const cu = Object.assign({}, base); for (const t of Object.keys(c.cuSum)) cu[t] = c.cuSum[t] / c.n;
        const sim = M.simGroup(targetN, c.group, cu, fixedBy[targetN] || {});
        if (sim.attackers[us]) {
          const cond = sim.attackers[us].cond; const ts = Object.keys(cond).sort((x, y) => cond[y] - cond[x]);
          Object.assign(c, { role: 'attack', cond, best: ts[0], bestEV: cond[ts[0]], P: sim.attackers[us].condP ? sim.attackers[us].condP[ts[0]] : null, foes: sim.D });
        } else if (sim.defenders[us]) {

        } else Object.assign(c, { role: 'none', foes: [] });

      const order = prevRole === 'attack' ? ['won', 'failed', 'none'] : ['spared', 'clean', 'partial', 'fell'];
      const summarize = (cs, tot) => {
        const bands = {}, best = {}, pIn = {}; let ev = 0, evW = 0;
        let dl = 0, pa = 0, dW = 0;
        for (const { c, w } of cs) {
          bands[c.gi] = (bands[c.gi] || 0) + w / tot;
          if (c.best) { best[c.best] = (best[c.best] || 0) + w / tot; ev += w * c.bestEV; evW += w; }
          if (c.role === 'defend') { dl += w * c.expLoss; pa += w * c.pAttacked; dW += w; }

        }

        return { bands: srt(bands).map(([g, p]) => ({ gi: +g, p })), best: srt(best).map(([t, p]) => ({ t, p })), foes: srt(pIn).map(([t, p]) => ({ t, p })), ev: evW ? ev / evW : null, pAtk: evW / tot, expLoss: dW ? dl / dW : null, pAttacked: dW ? pa / dW : null, pDef: dW / tot };
      };
      const byOut = order.filter(k => outs[k]).map(k => {
        const o = outs[k];
        return Object.assign({ out: k, p: o.n / n }, summarize(Object.entries(o.comps).map(([key, m]) => ({ c: comps[key], w: m })), o.n));
      });
      const all = summarize(list.map(c => ({ c, w: c.n })), n);
      return { round: R, prev: last, prevRole, n, comps: list, byOut, all };
    };

    M.bandValues = function (atkRoundN, defRoundN, baseCu) {
      const us = M.focus || cfg.us; const f = al[us].faction;
      const r = schedule.find(x => x.n === atkRoundN) || schedule.find(x => x.n === defRoundN);
      const week = r.week;
      const s = cfg.weekSizes[week] || 3;
      const others = M.factionOrder(baseCu, f).filter(t => t !== us);
      const nb = Math.floor((cfg.poolFrom - 1) / s) + 1;
      const out = [];
      for (let b = 1; b <= nb; b++) {
        const [lo, hi] = M.groupRange(b, week);
        if (lo > others.length + 1) break;
        const k = Math.min(lo - 1 + Math.floor(Math.min(s, 3) / 2), others.length);
        const above = k > 0 ? baseCu[others[k - 1]] : baseCu[others[0]] + 20000;
        const below = k < others.length ? baseCu[others[k]] : Math.max(0, above - 20000);
        const cu = Object.assign({}, baseCu, { [us]: (above + below) / 2 });

    };

    return M;
  }

  G.CW = { build, DEFAULT_CFG, mergeCfg, serverToUtc, other };
})(typeof window !== 'undefined' ? window : globalThis);

  'Every member of the No.1 faction gets the bigger faction reward (about double the No.2 reward). Members need the Optoelectronic Lab at Lv. 20 to receive it.': 'Todos os membros da facção Nº1 recebem a recompensa maior (cerca do dobro da Nº2). É preciso ter o Laboratório Optoeletrônico no Nv. 20 para receber.',
  'Copper moves between factions in every battle, and production adds the rest. Most alliances’ production is still estimated from economy size, so a screenshot of the in-game Faction ranking, or two leaderboards a few hours apart, will sharpen this.': 'O cobre muda de facção a cada batalha, e a produção soma o resto. A produção da maioria das alianças ainda é estimada pelo tamanho da economia; um print do ranking de Facção do jogo, ou dois rankings com algumas horas de diferença, deixam isso mais preciso.',
  'Our season tier': 'Nossa faixa na temporada', 'Now #{r}': 'Agora #{r}', 'Projected #{r}': 'Projeção #{r}', 'likely #{lo}–#{hi}': 'provável #{lo}–#{hi}', 'Chance of each reward tier': 'Chance de cada faixa de recompensa', 'current tier': 'faixa atual',
  'Rank {t}': 'Posição {t}', 'Reward tier {t}': 'Faixa de recompensa {t}', 'All alliances': 'Todas as alianças',
  'Proj. rank': 'Pos. proj.', 'Likely range': 'Faixa provável', 'Now': 'Agora', 'Change': 'Mudança', 'Proj. copper': 'Cobre proj.', 'Most likely tier': 'Faixa mais provável',
  'Ranks are the median of all simulations; the range covers 8 in 10 outcomes. Locked declarations on the Declare tab are used in every simulation.': 'As posições são a mediana de todas as simulações; a faixa cobre 8 em cada 10 resultados. Declarações travadas na aba Declarar são usadas em todas as simulações.',
  'calibrated to faction totals': 'calibrada pelos totais das facções', 'In-game total {v} ({d} server)': 'Total no jogo {v} ({d} servidor)',
  'Production is calibrated to the in-game faction totals: {r} {rr}/h, {b} {br}/h. Add a new faction reading on the Data tab every day or two to keep it accurate.': 'A produção está calibrada pelos totais das facções no jogo: {r} {rr}/h, {b} {br}/h. Adicione uma nova leitura das facções na aba Dados a cada um ou dois dias para mantê-la precisa.',
  'Faction totals': 'Totais das facções', 'From the Faction tab of the in-game leaderboard. Each reading is time-stamped when you save and keeps production in step with the game.': 'Da aba Facção do ranking do jogo. Cada leitura é registrada com horário ao salvar e mantém a produção alinhada com o jogo.',
  '{f} total copper': 'Cobre total de {f}', 'Save faction totals': 'Salvar totais das facções', 'Last reading: {a} · {b} ({d} server)': 'Última leitura: {a} · {b} ({d} servidor)', 'Enter both faction totals': 'Informe os dois totais', 'Faction totals saved': 'Totais das facções salvos',
  // device-only note (hosted copy)
  'Shared data as of {d} · {n} battles.': 'Dados compartilhados de {d} · {n} batalhas.', '{n} changes saved on this device only.': '{n} alterações salvas só neste aparelho.', '1 change saved on this device only.': '1 alteração salva só neste aparelho.',
  'Anything you edit or lock stays on this device only.': 'O que você editar ou travar fica só neste aparelho.', 'Discard my changes': 'Descartar minhas alterações', 'Tap again to discard': 'Toque de novo para descartar',
  'Picks weaker': 'Escolhe mais fracos', 'Picks stronger': 'Escolhe mais fortes', 'Mixed': 'Misto', 'lean {l} from {n} declarations': 'tendência {l} em {n} declarações', 'Sort: target style': 'Ordenar: estilo de alvo', 'Target style': 'Estilo de alvo', 'Target style: no declarations recorded yet, so the model assumes it chases expected copper.': 'Estilo de alvo: nenhuma declaração registrada ainda, então o modelo supõe que busca o maior cobre esperado.', 'Target style: <b>{s}</b> (lean {l}, from {n} declarations).': 'Estilo de alvo: <b>{s}</b> (tendência {l}, em {n} declarações).', 'Past picks by member power, 1 = weakest option:': 'Escolhas anteriores por poder dos membros, 1 = opção mais fraca:', '↓ marks attackers that usually pick the weakest target in their group, ↑ the strongest.': '↓ marca atacantes que costumam escolher o alvo mais fraco do grupo, ↑ o mais forte.', 'Declaration habits': 'Hábitos de declaração', 'Who hunts weak targets and who goes after strong ones': 'Quem caça alvos fracos e quem vai atrás dos fortes', 'Not enough recorded declarations yet to tell habits apart. Until then every alliance is assumed to chase its best expected copper.': 'Ainda não há declarações suficientes para distinguir hábitos. Até lá, supõe-se que cada aliança busca o maior cobre esperado.', 'Lean': 'Tendência', 'Past picks (power rank / options)': 'Escolhas anteriores (posição de poder / opções)', 'None': 'Nenhuma', 'from {n} recorded declarations': 'de {n} declarações registradas', 'Habits are real and they differ by alliance: weighed together with expected copper, each alliance’s own lean toward weaker or stronger targets predicts declarations better than copper alone.': 'Os hábitos são reais e variam por aliança: somada ao cobre esperado, a tendência de cada aliança para alvos mais fracos ou mais fortes prevê as declarações melhor do que o cobre sozinho.', 'Predicting each round from the other rounds only, the model named the actual target first <b>{h} of {n}</b> times, vs {o} for best-copper alone and about {r} by chance.': 'Prevendo cada rodada só com as outras rodadas, o modelo apontou o alvo real como primeira opção <b>{h} de {n}</b> vezes, contra {o} usando só o melhor cobre e cerca de {r} ao acaso.', 'Go for the weakest in their group': 'Vão atrás dos mais fracos do grupo', 'Go for the strongest in their group': 'Vão atrás dos mais fortes do grupo', 'Lean is how strongly past declarations favored low- or high-power targets among the options in the group, after allowing for expected copper (−1 means a clear habit of picking the weakest). “1/10” means it picked the weakest of 10 options. Alliances with only one or two declarations are pulled toward the average, and {m} others show no clear lean. Every forecast, group plan and the season projection use these habits.': 'A tendência mede o quanto as declarações anteriores favoreceram alvos de menor ou maior poder entre as opções do grupo, já descontando o cobre esperado (−1 indica um hábito claro de escolher o mais fraco). “1/10” significa que escolheu o mais fraco entre 10 opções. Alianças com só uma ou duas declarações são puxadas para a média, e {m} outras não mostram tendência clara. Todas as previsões, planos de grupo e a projeção da temporada usam esses hábitos.', '<b>Who declares on whom.</b> Learned from {n} past declarations: each alliance weighs expected copper and its own habit of picking weaker or stronger targets by member power. Lock real declarations on the Declare tab.': '<b>Quem declara contra quem.</b> Aprendido de {n} declarações anteriores: cada aliança pesa o cobre esperado e seu próprio hábito de escolher alvos mais fracos ou mais fortes pelo poder dos membros. Trave as declarações reais na aba Declarar.',
  'Show {n} more': 'Mostrar mais {n}',
  'If declared on': 'Se declararem contra nós', 'Center falls': 'Centro cai', 'Center holds, some buildings lost': 'Centro resiste, perde alguns prédios', 'We hold everything': 'Seguramos tudo', 'Center holds': 'Centro resiste', 'ranks {lo}–{hi}': 'posições {lo}–{hi}', 'Round {n} for us': 'Rodada {n} para nós', 'Where we land': 'Onde caímos', 'Best pick': 'Melhor alvo', 'All outcomes': 'Todos os resultados', 'Best declaration depends on round {p}': 'A melhor declaração depende da rodada {p}', 'Working through round {p} outcomes…': 'Calculando os resultados da rodada {p}…', 'best in {p} of outcomes': 'melhor em {p} dos resultados', 'Groups for round {n} lock {d} server, after round {p}. Where round {p} leaves us decides who we can hit, so this weighs every outcome for every alliance. Enter round {p} results and it narrows to one group.': 'Os grupos da rodada {n} fecham {d} (servidor), depois da rodada {p}. Onde a rodada {p} nos deixar decide quem podemos atacar, então isto pondera todos os resultados de todas as alianças. Registre os resultados da rodada {p} e a resposta se reduz a um grupo.', 'Depends on round {p}': 'Depende da rodada {p}', 'Where round {p} could leave us for round {n}': 'Onde a rodada {p} pode nos deixar para a rodada {n}', 'Simulated {k} times: every group’s declarations and results in round {p}, using each alliance’s habits and the measured loot. “Best pick” shares are how often each target came out on top. The group shown below is the single average projection, which can sit between real outcomes.': 'Simulado {k} vezes: declarações e resultados de todos os grupos na rodada {p}, usando os hábitos de cada aliança e o saque medido. As porcentagens de “Melhor alvo” mostram com que frequência cada alvo ficou em primeiro. O grupo mostrado abaixo é a projeção média única, que pode ficar entre resultados reais.', '<b>Copper.</b> Max plunder is {p} of the defender’s copper. Measured from {n} recorded battles: when the center fell, attackers took {w} of it on average (most between {lo} and {hi}, since defenders sometimes keep buildings). When the center held, {pr} of defenders still lost buildings, about {pt} of max plunder each, and the rest lost nothing. Multiple attackers split by damage share.': '<b>Cobre.</b> O saque máximo é {p} do cobre do defensor. Medido em {n} batalhas registradas: quando o centro caiu, os atacantes levaram em média {w} dele (a maioria entre {lo} e {hi}, porque às vezes o defensor mantém prédios). Quando o centro resistiu, {pr} dos defensores ainda perderam prédios, cerca de {pt} do saque máximo cada, e o resto não perdeu nada. Vários atacantes dividem pelo dano causado.', '<b>Later rounds.</b> A round whose groups lock after another round is fought is simulated across that round’s outcomes for every alliance, not just the average, because a lost or held defense can move an alliance into a different group.': '<b>Rodadas seguintes.</b> Uma rodada cujos grupos fecham depois de outra rodada ser disputada é simulada em todos os resultados possíveis dessa rodada para cada aliança, não só na média, porque uma defesa perdida ou mantida pode mudar a aliança de grupo.', 'Loot taken': 'Saque levado', 'Measured from battles': 'Medido nas batalhas', 'Set by hand': 'Definido manualmente', 'We hold the center, lose some buildings': 'Seguramos o centro, perdemos alguns prédios', 'Our center falls': 'Nosso centro cai', 'Our attack wins': 'Nosso ataque vence', 'Our attack fails': 'Nosso ataque falha', 'We have no target': 'Ficamos sem alvo',
  'Decide after R{p}': 'Decida após a R{p}',
  'Not declared on in round {p}': 'Ninguém nos declara na rodada {p}', 'Hold everything in round {p}': 'Seguramos tudo na rodada {p}', 'Hold our center in round {p}, lose some buildings': 'Seguramos o centro na rodada {p}, perdemos alguns prédios', 'Lose our center in round {p}': 'Perdemos o centro na rodada {p}', 'Our round {p} attack wins': 'Nosso ataque da rodada {p} vence', 'Our round {p} attack fails': 'Nosso ataque da rodada {p} falha', 'No target in round {p}': 'Sem alvo na rodada {p}', 'If round {p} goes': 'Se a rodada {p} terminar assim', 'Our round {n} group': 'Nosso grupo na rodada {n}', 'We declare on': 'Declaramos contra', 'Expected gain': 'Ganho esperado', 'Who we declare on depends on round {p}': 'Contra quem declaramos depende da rodada {p}', 'Round {n} groups lock {d} server, after round {p} is fought. How our round {p} defense goes moves us up or down the rankings, which decides which defenders we can declare on. Enter the round {p} results and this narrows to one target list.': 'Os grupos da rodada {n} fecham {d} (servidor), depois da rodada {p}. O resultado da nossa defesa na rodada {p} nos move para cima ou para baixo no ranking, e isso decide contra quais defensores podemos declarar. Registre os resultados da rodada {p} e isto se reduz a uma lista de alvos.', 'Who we can declare on in round {n} depends on round {p}': 'Contra quem podemos declarar na rodada {n} depende da rodada {p}', 'Simulated {k} times: every group’s declarations and results in round {p}, using each alliance’s habits and the measured loot. The percentage next to each target is how often it was our best declaration in that case. The group shown below is the single average projection, which can sit between real outcomes.': 'Simulado {k} vezes: declarações e resultados de todos os grupos na rodada {p}, usando os hábitos de cada aliança e o saque medido. A porcentagem ao lado de cada alvo é a frequência com que ele foi nossa melhor declaração naquele caso. O grupo mostrado abaixo é a projeção média única, que pode ficar entre resultados reais.',
  'Round {n} groups lock {d} server, after round {p} is fought. How our round {p} attack goes moves us up or down the rankings, which decides which defenders we can declare on. Enter the round {p} results and this narrows to one target list.': 'Os grupos da rodada {n} fecham {d} (servidor), depois da rodada {p}. O resultado do nosso ataque na rodada {p} nos move para cima ou para baixo no ranking, e isso decide contra quais defensores podemos declarar. Registre os resultados da rodada {p} e isto se reduz a uma lista de alvos.',
  'Copper now (est.)': 'Cobre agora (est.)', 'Copper (est.)': 'Cobre (est.)', 'Last copper reading {c} ({d} server)': 'Última leitura de cobre {c} ({d} servidor)', '<b>Copper.</b> Max plunder is {p} of the defender’s copper when declarations open. Measured from {n} recorded battles: when the center fell, attackers took {w} of it on average, usually all of it. When the center held, {pr} of defenders still lost buildings, usually about 20% or 60% of max plunder, and the rest lost nothing. Multiple attackers split by damage share. Copper between readings is estimated from production and recorded battles, so fresh leaderboard readings keep groups accurate.': '<b>Cobre.</b> O saque máximo é {p} do cobre do defensor no momento em que as declarações abrem. Medido em {n} batalhas registradas: quando o centro caiu, os atacantes levaram em média {w} dele, normalmente tudo. Quando o centro resistiu, {pr} dos defensores ainda perderam prédios, normalmente cerca de 20% ou 60% do saque máximo, e o resto não perdeu nada. Vários atacantes dividem pelo dano causado. O cobre entre leituras é estimado pela produção e pelas batalhas registradas, então leituras novas do ranking mantêm os grupos precisos.',
  '{v} ahead of {x} (#{n}); if they pass us we drop a group': '{v} à frente de {x} (#{n}); se nos passarem, caímos um grupo', '{v} behind {x} (#{n}) to move up a group': '{v} atrás de {x} (#{n}) para subir um grupo', 'Band edge:': 'Limite da faixa:', 'That is within estimate error. A fresh Alliance leaderboard before {d} server will settle it.': 'Isso está dentro do erro da estimativa. Um ranking de Alianças atualizado antes de {d} (servidor) resolve.',
  'rounds {a}–{b}': 'rodadas {a}–{b}', 'round {p}': 'rodada {p}', 'Working through {rr} outcomes…': 'Calculando os resultados de {rr}…', 'Where we likely land': 'Onde devemos cair', 'Most often in our group': 'Mais frequentes no nosso grupo', '{p} of outcomes': '{p} dos resultados', 'Who can declare on us depends on our rank after {rr}. This weighs every outcome for every alliance and narrows as results come in.': 'Quem pode declarar contra nós depende da nossa posição após {rr}. Isto pondera todos os resultados de todas as alianças e se reduz conforme os resultados chegam.', 'No reason to tank round {n}': 'Não vale a pena perder de propósito na rodada {n}', 'Round {n} is the last round, so losing on purpose can’t buy an easier group later. It would only hand over copper. Fight every defense.': 'A rodada {n} é a última, então perder de propósito não compra um grupo mais fácil depois. Só entregaria cobre. Lute em todas as defesas.',
  '<b>Win chance.</b> Each alliance has a rating built from member power and economy, then moved by every result (K={k}). Every 1G of member power is worth {l} rating points, so a 2.5G gap alone means about {p} to win; a ratio term adds {b} points per doubling. Attackers add their strength together; an invited assist counts at {a} weight. Attacker edge: {h} points. Parameters refit automatically as battles are added.': '<b>Chance de vitória.</b> Cada aliança tem um rating formado pelo poder dos membros e pela economia, ajustado a cada resultado (K={k}). Cada 1G de poder dos membros vale {l} pontos de rating, então uma diferença de 2,5G sozinha significa cerca de {p} de vitória; um termo de proporção soma {b} pontos a cada vez que o poder dobra. Os atacantes somam suas forças; um assistente convidado conta com peso {a}. Vantagem do atacante: {h} pontos. Os parâmetros se reajustam automaticamente quando novas batalhas são adicionadas.',
  'View as': 'Ver como', 'Warzone-mate': 'Aliado da zona', 'Viewing as {tag}. Every tab now plans from their side.': 'Vendo como {tag}. Todas as abas agora planejam pelo lado deles.', 'Back to {tag}': 'Voltar para {tag}',
  'Locked {d} server · rebuilt from copper readings, confirm in game': 'Fechado {d} (servidor) · reconstruído a partir das leituras de cobre, confirme no jogo',
  '<b>Held centers.</b> Close calls cost the defender more. A center that holds still loses about {a} of max plunder when the attackers had a 10% chance, and about {b} when they had 60%, measured from {n} held defenses.': '<b>Centros que resistem.</b> Disputas apertadas custam mais ao defensor. Um centro que resiste ainda perde cerca de {a} do saque máximo quando os atacantes tinham 10% de chance, e cerca de {b} quando tinham 60%, medido em {n} defesas mantidas.',
  'Copper production fell from {a}/h to {b}/h between the last two readings. Usually means cities were dropped to slide down the rankings.': 'A produção de cobre caiu de {a}/h para {b}/h entre as duas últimas leituras. Normalmente significa que cidades foram abandonadas para descer no ranking.', 'cities dropped? {a}→{b}/h': 'cidades abandonadas? {a}→{b}/h', 'production {a}/h → {b}/h since {d}.': 'produção {a}/h → {b}/h desde {d}.', 'At that rate they sit #{r} in {f} at the round {n} lock, ranks {lo}–{hi}.': 'Nesse ritmo ficam em #{r} em {f} no fechamento da rodada {n}, posições {lo}–{hi}.', 'Production alert': 'Alerta de produção', 'Groups use each alliance’s latest production rate, so this is already in every projection. If they retake cities before the lock, a fresh leaderboard will show it.': 'Os grupos usam o ritmo de produção mais recente de cada aliança, então isso já está em todas as projeções. Se retomarem cidades antes do fechamento, um ranking novo vai mostrar.', 'Production by period:': 'Produção por período:',
  'Chance to win, Faction Duel included': 'Chance de vencer, com o Duelo de Facções', 'Faction Duel decides it': 'O Duelo de Facções decide', 'Chance {f} wins the duel': 'Chance de {f} vencer o duelo', '{f} wins the duel': '{f} vence o duelo', '{r} leads by {l} now and is projected to lead by {p} at settlement (most likely {lo} to {hi}). The duel pays the winning faction {c} for the Capitol and {n} per Cannon, so one building is worth more than the whole lead.': '{r} lidera por {l} agora e deve liderar por {p} no fechamento (mais provável entre {lo} e {hi}). O duelo paga à facção vencedora {c} pelo Capitólio e {n} por Canhão, então um único prédio vale mais que toda a vantagem.', 'Duel result': 'Resultado do duelo', '{f} wins the faction race': '{f} vence a disputa de facções', '{f} wins, holds only one Cannon (+{v})': '{f} vence, controla só um Canhão (+{v})', '{f} wins, holds the Capitol (+{v})': '{f} vence, controla o Capitólio (+{v})', '{f} wins, holds the Capitol and a Cannon (+{v})': '{f} vence, controla o Capitólio e um Canhão (+{v})', 'The faction cards assume the duel winner holds at least the Capitol. Without the duel, {f} would win {p} of simulations. Duel copper counts only for the faction race, not for alliance ranks or reward tiers.': 'Os cartões das facções supõem que o vencedor do duelo controla ao menos o Capitólio. Sem o duelo, {f} venceria em {p} das simulações. O cobre do duelo conta só para a disputa de facções, não para o ranking das alianças nem para as faixas de recompensa.',
  'Production is measured for every alliance from successive leaderboards: {r} {rr}/h, {b} {br}/h in total.': 'A produção é medida para todas as alianças a partir de rankings sucessivos: {r} {rr}/h, {b} {br}/h no total.',
  'even': 'equilibrado', '{p} power': '{p} de poder', 'Strategic areas and assigned warzones (max prize {v})': 'Áreas estratégicas e zonas designadas (prêmio máximo {v})', 'Area': 'Área', 'Power edge': 'Vantagem de poder', '(No.1 warzones, can hit any area)': '(zonas Nº1, podem atacar qualquer área)', 'Power is the summed member power of the alliances we track in each warzone ({r} {rp} vs {b} {bp} overall). It ignores untracked alliances and who actually shows up, so treat it as a rough guide.': 'O poder é a soma do poder dos membros das alianças que acompanhamos em cada zona ({r} {rp} contra {b} {bp} no total). Não inclui alianças fora da lista nem quem realmente participa, então use como referência aproximada.',

 então as alianças do topo contam muito mais que o poder total. Os Canhões são disputados primeiro; as zonas que vencem o seu entram na luta pelo Capitólio, cada Canhão controlado soma {f} ao seu lado lá, e quem controla o Capitólio vence. Defensores não ganham bônus, como nas batalhas da guerra do cobre. Presença e coordenação no domingo não estão nos dados, então use como ponto de partida.', 'The faction cards use the model’s duel odds; pick a number above to use your own. Without the duel, {f} would win {p} of simulations. Duel copper counts only for the faction race, not for alliance ranks or reward tiers.': 'Os cartões das facções usam a chance do modelo para o duelo; escolha um número acima para usar a sua. Sem o duelo, {f} venceria em {p} das simulações. O cobre do duelo conta só para a disputa de facções, não para o ranking das alianças nem para as faixas de recompensa.', '<b>Faction Duel.</b> Each area is scored with the copper war battle formula applied to each warzone’s five highest-rated alliances. Cannons are fought first, warzones that win them join the Capitol fight with a bonus per Cannon held, and the Capitol holder wins the duel and the Capitol copper.': '<b>Duelo de Facções.</b> Cada área é avaliada com a fórmula de batalha da guerra do cobre aplicada às cinco alianças com maior rating de cada zona. Os Canhões são disputados primeiro, as zonas que os vencem entram na luta pelo Capitólio com um bônus por Canhão controlado, e quem controla o Capitólio vence o duelo e o cobre do Capitólio.',
};
function t(s, p){ let out = (LANG === 'pt' && PT[s] != null) ? PT[s] : s; if (p) out = out.replace(/\{(\w+)\}/g, (m, k) => (p[k] != null ? p[k] : m)); return out; }

/* ---------- formatting ---------- */
function fCu(n, d){ if (n == null || !isFinite(n)) return '—'; const a = Math.abs(n), s = n < 0 ? '−' : ''; if (a >= 1e6) return s + (a/1e6).toFixed(d == null ? 2 : d) + 'M'; if (a >= 1e3) return s + (a/1e3).toFixed(a >= 1e5 ? 0 : 1) + 'K'; return s + Math.round(a); }
function fSigned(n){ if (!isFinite(n)) return '—'; return (n > 0 ? '+' : n < 0 ? '' : '±') + fCu(n); }
function fPct(p){ return p == null || !isFinite(p) ? '—' : Math.round(p * 100) + '%'; }
function fPow(g){ if (!g) return '—'; return g >= 1 ? g.toFixed(1) + 'G' : Math.round(g * 1000) + 'M'; }
function parseCu(s){ if (s == null) return NaN; s = String(s).trim().replace(/,/g,'').replace(/^\+|^−|^-/,''); const m = s.match(/^([\d.]+)\s*([kKmM]?)$/); if (!m) return NaN; let v = parseFloat(m[1]); if (/k/i.test(m[2])) v *= 1e3; if (/m/i.test(m[2])) v *= 1e6; return Math.round(v); }

  const days = LANG === 'pt' ? ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'] : ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const mo = d.getUTCMonth() + 1, da = d.getUTCDate(); const hh = String(d.getUTCHours()).padStart(2,'0'), mm = String(d.getUTCMinutes()).padStart(2,'0');
  return (withDay ? days[d.getUTCDay()] + ' ' : '') + (LANG === 'pt' ? da + '/' + mo : mo + '/' + da) + ' ' + hh + ':' + mm;
}
function localStr(ts){ try { return new Date(ts).toLocaleString(LANG === 'pt' ? 'pt-BR' : [], { weekday:'short', month:'numeric', day:'numeric', hour:'numeric', minute:'2-digit' }); } catch(e){ return new Date(ts).toISOString(); } }
function until(ts){ const d = ts - Date.now(); if (d <= 0) return t('now'); const h = Math.floor(d / HOUR), m = Math.floor((d % HOUR) / 60000); return h >= 48 ? Math.floor(h/24) + 'd ' + (h%24) + 'h' : h + 'h ' + String(m).padStart(2,'0') + 'm'; }

function tagH(tg, withDot){ const a = M && M.al[tg]; const f = a ? a.faction : ''; return (withDot && f ? '<span class="dot ' + f + '" style="margin-right:6px"></span>' : '') + '<span class="tag">[' + esc(tg) + ']</span>'; }

const hiS = hi => hi >= 100 ? '100' : hi;

/* ---------- model ---------- */

  if (M) { if (S.view && M.al[S.view] && S.view !== M.cfg.us) M.focus = S.view; else S.view = null; }

}
const us = () => M.focus || M.cfg.us;

function setView(tg){ S.view = tg && tg !== M.cfg.us ? tg : null; try { if (S.view) localStorage.setItem('qiet.view', S.view); else localStorage.removeItem('qiet.view'); } catch (e) {} M.focus = S.view || M.cfg.us; memo = {}; render(); }

function scenFor(n){

  if (!memo['q' + k]) { memo['q' + k] = 1; const keep = memo; setTimeout(() => { if (memo !== keep) return; try { memo[k] = M.roundScenarios(n, 250, { fixed: fixedByRound() }); } catch (e) { console.error(e); memo[k] = null; } render(); }, 40); }
  return undefined;
}
function needsScen(r){ return M.schedule.some(x => !x.played && x.t > Date.now() && x.t < r.lockT); }
function outLbl(o, p){ return t({ spared: 'Not declared on in round {p}', clean: 'Hold everything in round {p}', partial: 'Hold our center in round {p}, lose some buildings', fell: 'Lose our center in round {p}', won: 'Our round {p} attack wins', failed: 'Our round {p} attack fails', none: 'No target in round {p}' }[o] || o, { p }); }
function defSplit(pl){ const F = M.lootFit; const pr = F && F.used ? (F.heldB != null && F.partialTake ? Math.min(1, M.heldTake(pl) / F.partialTake) : F.partialRate) : 0; return { fell: pl, partial: (1 - pl) * pr, clean: (1 - pl) * (1 - pr), partialTake: F && F.used ? F.partialTake : M.cfg.lossTake }; }
function ourF(){ return M.al[us()] ? M.al[us()].faction : 'red'; }
function roleOf(r){ return r.atk === ourF() ? 'attack' : 'defend'; }
function curGroupOf(tg){ const nx = upcoming()[0]; if (!nx) return null; const st = stepFor(nx.n); if (!st || !st.groups.franks[tg]) return null; return M.groupIdx(st.groups.franks[tg], nx.week); }
function aggScen(scen){ const m = {}; for (const s of scen) { const k = s.attackers.join('+') + '|' + s.assists.join('+'); (m[k] = m[k] || { attackers: s.attackers, assists: s.assists, p: 0, P: 0 }); m[k].p += s.p; m[k].P += s.p * s.P; } return Object.values(m).map(x => (x.P /= x.p, x)).sort((a, b) => b.p - a.p); }
const roundOpt = x => t('Round {n}', { n: x.n }) + ' · ' + serverStr(x.t, true) + ' · ' + weRole(roleOf(x));

/* ---------- War Room ---------- */
function unitRow(tg, cu, extra){

  return '<div class="unit ' + a.faction + (tg === us() ? ' us' : '') + '"><div class="l"><span>' + tagH(tg) + ' <span class="small">' + esc(a.name || '') + '</span></span>' +
    '<span class="meta">#' + esc(a.warzone || '?') + ' · ' + t('{pw} power · rating {r}', { pw: fPow(a.pw) + (a.pwImputed ? ' ' + t('est.') : ''), r: Math.round(a.rating) }) + '</span></div>' +
    '<div class="r"><span class="mono">' + fCu(cu[tg]) + '</span><span class="meta">A ' + a.atkW + '–' + a.atkL + ' · D ' + a.defW + '–' + a.defL + '</span>' + (extra ? '<span class="meta">' + extra + '</span>' : '') + '</div></div>';

function renderRoom(){

function edgeH(cu, r){
  if (r.lockT < Date.now()) return '';
  const ord = M.factionOrder(cu, ourF()); const i = ord.indexOf(us()); if (i < 0) return '';
  const gi = M.groupIdx(i + 1, r.week); const [lo, hi] = M.groupRange(gi, r.week);
  const below = hi < 100 ? ord[hi] : null, above = lo > 1 ? ord[lo - 2] : null;
  const parts = [];
  if (below) parts.push(t('{v} ahead of {x} (#{n}); if they pass us we drop a group', { v: fCu(cu[us()] - cu[below]), x: tagH(below), n: hi + 1 }));
  if (above) parts.push(t('{v} behind {x} (#{n}) to move up a group', { v: fCu(cu[above] - cu[us()]), x: tagH(above), n: lo - 1 }));
  if (!parts.length) return '';
  // estimates drift roughly 600 copper per hour since an alliance's last reading (measured on the 10/14 readings)
  const tol = x => Math.max(5000, 600 * Math.max(0, (r.lockT - Math.min(M.al[us()].copperAt, M.al[x].copperAt)) / HOUR));
  const close = below && cu[us()] - cu[below] < tol(below) || above && cu[above] - cu[us()] < tol(above);
  return '<div class="callout' + (close ? ' warn' : '') + ' small">' + t('Band edge:') + ' ' + parts.join(' · ') + '.' + (close ? ' ' + t('That is within estimate error. A fresh Alliance leaderboard before {d} server will settle it.', { d: esc(serverStr(r.lockT, true)) }) : '') + '</div>';
}
function rateAlerts(nx){

  const drops = M.tags.filter(x => M.al[x].rateDrop && !M.al[x].unknown && !M.al[x].inactive).sort((x, y) => (st.cuLock[y] || 0) - (st.cuLock[x] || 0)).slice(0, 6);
  if (!drops.length) return '';
  const rows = drops.map(x => {
    const a = M.al[x], d = a.rateDrop; const fr = st.groups.franks[x]; const gi = fr ? M.groupIdx(fr, nx.week) : null;
    const [lo, hi] = gi ? M.groupRange(gi, nx.week) : [0, 0];
    return '<li>' + tagH(x, true) + ' ' + t('production {a}/h → {b}/h since {d}.', { a: fCu(d.from), b: fCu(d.to), d: esc(serverStr(d.since, true)) }) + (gi ? ' ' + t('At that rate they sit #{r} in {f} at the round {n} lock, ranks {lo}–{hi}.', { r: fr, f: esc(fname(a.faction)), n: nx.n, lo, hi: hiS(hi) }) : '') + '</li>';
  }).join('');
  return '<section class="panel"><div class="callout warn"><b>' + t('Production alert') + '</b><ul class="plain small" style="margin-top:6px">' + rows + '</ul><div class="small" style="margin-top:6px">' + t('Groups use each alliance’s latest production rate, so this is already in every projection. If they retake cities before the lock, a fresh leaderboard will show it.') + '</div></div></section>';
}
function stat(v, l){ return '<div class="stat"><span class="v">' + v + '</span><span class="l">' + l + '</span></div>'; }
function priorRounds(r){ return M.schedule.filter(x => !x.played && x.t > Date.now() && x.t < r.lockT).map(x => x.n); }
function roundsLbl(ns){ return ns.length > 1 ? t('rounds {a}–{b}', { a: ns[0], b: ns[ns.length - 1] }) : t('round {p}', { p: ns[0] }); }
