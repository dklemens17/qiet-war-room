  h += '<section class="panel"><div class="panel-h"><h3>Recorded battles (' + S.battles.length + ')</h3></div>' +
    (S.battles.length ? Object.keys(byR).sort((a, b) => b - a).map(n => '<details' + (n == Math.max(...Object.keys(byR).map(Number)) ? ' open' : '') + '><summary>Round ' + n + ' · ' + byR[n].length + ' battles</summary><div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>Attackers</th><th>Defenders</th><th>Winner</th><th class="n">Copper</th><th></th></tr></thead><tbody>' +
      byR[n].slice().sort((a, b) => String(a.id).localeCompare(String(b.id))).map(b => '<tr><td>' + b.attackers.map(x => tagH(x.tag)).join(' + ') + '</td><td>' + b.defenders.map((x, i) => tagH(x.tag) + (i ? ' <span class="small muted">asst</span>' : '')).join(' ') + '</td><td>' + (b.winner === 'A' ? 'Attack' : 'Defense') + '</td><td class="n mono">' + fCu(b.defenders[0].cu) + '</td><td>' + (ro ? '' : '<button class="btn ghost small" data-edit="' + esc(b.id) + '">Edit</button><button class="btn ghost small" data-del="' + esc(b.id) + '">Delete</button>') + '</td></tr>').join('') + '</tbody></table></div></details>').join('') : '<div class="empty"><h3>No battles yet</h3><p>Add one above, or send the Battle Record screenshots to Claude.</p></div>') + '</section>';
  // alliance editor
  const et = S.editTag && M && M.al[S.editTag] ? M.al[S.editTag] : null;
  h += '<section class="panel"><div class="panel-h"><div><div class="eyebrow">Rankings</div><h3>Update one alliance</h3></div></div><form id="aForm" class="form-grid">' +
    '<label class="f">Alliance<input type="text" list="tagsDL" id="aTag" value="' + esc(S.editTag || '') + '" autocomplete="off"></label>' +
    '<label class="f">Copper now<input type="text" id="aCu" placeholder="' + (et ? esc(fCu(et.copper)) : '1,487,332') + '" inputmode="decimal"></label>' +
    '<label class="f">Power (G)<input type="text" id="aPw" placeholder="' + (et ? esc(fPow(et.pw)) : '20.4') + '" inputmode="decimal"></label>' +
    '<label class="f">Production per hour<input type="text" id="aG" placeholder="' + (et ? esc(fCu(et.g)) + ' (' + esc(et.gSrc) + ')' : '2.8K') + '" inputmode="decimal"></label>' +
    '<label class="f">Warzone (new alliances)<input type="text" id="aZone" placeholder="' + (et ? esc(et.warzone || '') : '1600') + '" inputmode="numeric"></label>' +
    '<label class="f">Status<select id="aInactive"><option value="0"' + (et && et.inactive ? '' : ' selected') + '>In the faction ranking</option><option value="1"' + (et && et.inactive ? ' selected' : '') + '>Not ranked / left</option></select></label>' +
    '<label class="f" style="grid-column:1/-1">Notes<input type="text" id="aNotes" value="' + esc(et && et.notes || '') + '"></label>' +
    '<div class="controls"><button class="btn primary" type="submit"' + (ro ? ' disabled' : '') + '>Save alliance</button></div></form>' +
    '<p class="small muted">Copper is time-stamped when you save, so two readings a few hours apart measure that alliance’s real production rate.</p></section>';
  // bulk
  h += '<section class="panel"><div class="panel-h"><div><div class="eyebrow">Rankings</div><h3>Paste a leaderboard</h3></div></div>' +
    '<p class="small muted">One alliance per line with its tag in brackets and its copper, e.g. <span class="mono">18 [QIET]Quiet Warzone #1600 1,487,332</span>. Power like <span class="mono">Power: 20.4G</span> on the same line is picked up too.</p>' +
    '<textarea id="bulk" aria-label="Leaderboard text" placeholder="[bURn]Forged in fire #1601 2,059,034&#10;[ONSH]OneShot #1601 1,978,570"></textarea><div class="controls"><button class="btn primary" id="bulkGo"' + (ro ? ' disabled' : '') + '>Update rankings</button><span class="small muted" id="bulkMsg"></span></div></section>';
  // settings
  const c = M ? M.cfg : CW.DEFAULT_CFG;
  h += '<section class="panel"><div class="panel-h"><div><div class="eyebrow">Settings</div><h3>Assumptions</h3></div></div><form id="sForm" class="form-grid">' +
    '<label class="f">Our alliance tag<input type="text" id="sUs" value="' + esc(c.us) + '"></label>' +
    '<label class="f">Max plunder (% of copper)<input type="number" step="0.5" id="sPl" value="' + (c.plunderPct * 100) + '"></label>' +
    '<label class="f">Winners take (% of max)<input type="number" step="1" id="sWt" value="' + Math.round(c.winTake * 100) + '"></label>' +
    '<label class="f">Failed attacks take (% of max)<input type="number" step="1" id="sLt" value="' + Math.round(c.lossTake * 100) + '"></label>' +
    '<label class="f">Invited assist shows up (%)<input type="number" step="5" id="sAp" value="' + Math.round(c.assistProb * 100) + '"></label>' +
    '<label class="f">Groups decided at<select id="sLock"><option value="decl"' + (c.lockMode === 'decl' ? ' selected' : '') + '>Declaration opening</option><option value="week"' + (c.lockMode === 'week' ? ' selected' : '') + '>Week start (Mon 00:00)</option></select></label>' +
    '<label class="f">Our production / hour<input type="text" id="sRate" value="' + esc(fCu((c.knownRates || {})[c.us] || 0)) + '"></label>' +
    '<label class="f">Server time vs UTC (hours)<input type="number" step="1" id="sOff" value="' + c.serverUtcOffset + '"></label>' +
    '<div class="controls" style="align-self:end"><button class="btn primary" type="submit"' + (ro ? ' disabled' : '') + '>Save settings</button></div></form></section>';
  h += '<section class="panel"><div class="split"><div><div class="eyebrow">Backup</div><h3>Copy everything as JSON</h3></div><button class="btn" id="exportBtn">Copy JSON</button></div><textarea id="exportBox" hidden readonly aria-label="Exported JSON"></textarea></section>';
  return h;
}

/* ---------- render + events ---------- */
function render(){
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
  renderTop();
  const main = $('#main');
  if (!M) {
    const waiting = !(S.got.al && S.got.b);
    main.innerHTML = (S.tab === 'data' && !waiting) ? renderData() : '<section class="panel"><div class="empty"><h3>' + (waiting && S.dbState !== 'none' ? 'Loading battle records' : 'No alliance data yet') + '</h3><p>' + (S.dbState === 'none' ? 'The shared record is not available in this view. Open the published page on claude.ai to see the data.' : 'Battles, rankings and power come from the shared record. Open the Data tab to add the first entries, or send screenshots to Claude.') + '</p></div></section>';
    wire(); return;
  }
  let h = '';
  try {
    if (S.tab === 'room') h = renderRoom();
    else if (S.tab === 'alliances') h = renderAlliances();
    else if (S.tab === 'declare') h = renderDeclare();
    else if (S.tab === 'strategy') h = renderStrategy();
    else if (S.tab === 'zone') h = renderZone();
    else h = renderData();
  } catch (e) { console.error(e); h = '<section class="panel"><div class="callout warn">Something in the data could not be analyzed: ' + esc(e.message) + '. Check the Data tab for a malformed battle.</div></section>'; }
  main.innerHTML = h;
  wire();
}
function wire(){
  document.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => { S.tab = b.dataset.goto; if (b.dataset.round) { S.selRound = +b.dataset.round; S.selGroup = null; } saveTab(); render(); window.scrollTo(0, 0); });
  document.querySelectorAll('[data-sort]').forEach(th => th.onclick = () => { const k = th.dataset.sort; if (S.sort.key === k) S.sort.dir *= -1; else S.sort = { key: k, dir: ['t', 'frank', 'rank', 'g', 'bAavg', 'bDavg'].includes(k) ? 1 : -1 }; render(); });
  document.querySelectorAll('[data-ff]').forEach(b => b.onclick = () => { S.fFaction = b.dataset.ff; render(); });
  document.querySelectorAll('[data-fg]').forEach(b => b.onclick = () => { S.fGroup = b.dataset.fg; render(); });
  document.querySelectorAll('[data-basis]').forEach(b => b.onclick = () => { S.basis = b.dataset.basis; if (S.sort.key === 'frank' || S.sort.key === 'rank') S.sort.key = S.basis === 'f' ? 'frank' : 'rank'; render(); });
  document.querySelectorAll('[data-open]').forEach(tr => { const f = () => { S.open = S.open === tr.dataset.open ? null : tr.dataset.open; render(); }; tr.onclick = f; tr.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); f(); } }; });
  const q = $('#q'); if (q) { q.oninput = () => { S.q = q.value; clearTimeout(wire._q); wire._q = setTimeout(() => { const pos = q.selectionStart; render(); const nq = $('#q'); if (nq) { nq.focus(); try { nq.setSelectionRange(pos, pos); } catch (e) {} } }, 200); }; }
  const sr = $('#selRound'); if (sr) sr.onchange = () => { S.selRound = +sr.value; S.selGroup = null; render(); };
  const sg = $('#selGroup'); if (sg) sg.onchange = () => { S.selGroup = +sg.value; render(); };
  const zr = $('#zoneRound'); if (zr) zr.onchange = () => { S.zoneRound = +zr.value; render(); };
  const zs = $('#zoneSel'); if (zs) zs.onchange = () => { S.zone = zs.value; renderTop(); render(); };
  document.querySelectorAll('[data-fix]').forEach(sel => sel.onchange = () => saveFix(+sel.dataset.round, sel.dataset.fix, sel.value));
  drawBandChart(); wireBandTip();
  const bf = $('#bForm'); if (bf) bf.onsubmit = e => { e.preventDefault(); saveBattle(); };
  const bc = $('#bCancel'); if (bc) bc.onclick = () => { S.editBattle = null; render(); };
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { S.editBattle = b.dataset.edit; render(); window.scrollTo(0, 0); });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => delBattle(b.dataset.del, b));
  const af = $('#aForm'); if (af) { af.onsubmit = e => { e.preventDefault(); saveAlliance(); }; const at = $('#aTag'); at.onchange = () => { S.editTag = at.value.trim(); render(); }; }
  const bg = $('#bulkGo'); if (bg) bg.onclick = bulkUpdate;
  const sf = $('#sForm'); if (sf) sf.onsubmit = e => { e.preventDefault(); saveSettings(); };
  const ex = $('#exportBtn'); if (ex) ex.onclick = exportJSON;
}
function saveTab(){ try { localStorage.setItem('qiet.tab', S.tab); } catch (e) {} }
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { S.tab = b.dataset.tab; saveTab(); render(); }));

/* ---------- writes ---------- */
async function guard(fn, okMsg){
  if (!S.db) { toast('The shared record is not connected in this view'); return; }
  try { await fn(); if (okMsg) toast(okMsg); }
  catch (e) { console.error(e); toast(e && e.code === 'invalid_argument' ? 'You have view-only access here' : 'Could not save: ' + (e && (e.message || e.code) || 'unknown error')); if (e && e.code === 'invalid_argument') { S.canWrite = false; render(); } }
}
function readSide(prefix, cuPrefix, n){ const out = []; for (let i = 0; i < n; i++) { const t = ($('#' + prefix + i) || {}).value; if (!t || !t.trim()) continue; const c = cuPrefix ? parseCu(($('#' + cuPrefix + i) || {}).value || '0') : 0; out.push({ tag: t.trim().replace(/^\[|\]$/g, ''), cu: isFinite(c) ? c : 0 }); } return out; }
function saveBattle(){
  const round = +$('#bRound').value, winner = $('#bWin').value;
  const attackers = readSide('bA', 'bAc', 3);
  const d0 = readSide('bD', 'bDc', 1); const assists = readSide('bD', null, 3).slice(1).map(x => ({ tag: x.tag, cu: 0 }));
  if (!attackers.length || !d0.length) { toast('Add at least one attacker and the defender'); return; }
  const defenders = d0.concat(assists);
  const r = (M ? M.cfg.rounds : CW.DEFAULT_CFG.rounds).find(x => x.n === round);
  let id = S.editBattle;
  if (!id) { const used = new Set(S.battles.map(b => b.id)); let k = S.battles.filter(b => b.round === round).length + 1; do { id = 'r' + round + '-' + String(k).padStart(2, '0'); k++; } while (used.has(id)); }
  const doc = { id, round, date: r ? r.date : '', atkFaction: r ? r.atk : '', attackers, defenders, winner, note: ($('#bNote').value || '').trim(), updatedAt: new Date().toISOString() };
  guard(async () => { await S.db.doc('battles/' + id).set(doc); S.editBattle = null; }, S.editBattle ? 'Battle saved' : 'Battle added');
}
function delBattle(id, btn){
  if (btn.dataset.armed !== '1') { btn.dataset.armed = '1'; btn.textContent = 'Tap again to delete'; setTimeout(() => { if (btn.isConnected) { btn.dataset.armed = ''; btn.textContent = 'Delete'; } }, 3000); return; }
  guard(() => S.db.doc('battles/' + id).delete(), 'Battle deleted');
}
function factionOfZone(z){ const c = M ? M.cfg : CW.DEFAULT_CFG; if (c.factions.red.zones.includes(+z)) return 'red'; if (c.factions.blue.zones.includes(+z)) return 'blue'; return null; }
async function upsertAlliance(tag, patch){
  const ex = S.alliances.find(a => a.tag === tag);
  const now = new Date().toISOString();
  if (patch.copper != null) { const hist = ((ex && ex.hist) || []).slice(-11); hist.push({ at: now, cu: patch.copper, exact: true }); patch.hist = hist; patch.copperAt = now; }
  if (patch.power != null) patch.powerAt = now;
  if (ex) await S.db.doc('alliances/' + tag).update(patch);
  else { if (!patch.faction) throw { message: 'New alliance ' + tag + ' needs a warzone' }; await S.db.doc('alliances/' + tag).set(Object.assign({ tag, name: tag }, patch)); }
}
function saveAlliance(){
  const tag = ($('#aTag').value || '').trim().replace(/^\[|\]$/g, ''); if (!tag) { toast('Pick an alliance'); return; }
  const patch = {};
  const cu = parseCu($('#aCu').value); if (isFinite(cu)) patch.copper = cu;
  const pwS = ($('#aPw').value || '').trim(); if (pwS) { const m = pwS.match(/([\d.]+)\s*([gGmM]?)/); if (m) patch.power = /m/i.test(m[2]) ? parseFloat(m[1]) / 1000 : parseFloat(m[1]); }
  const g = parseCu($('#aG').value); if (isFinite(g)) patch.growth = g;
  const z = ($('#aZone').value || '').trim(); if (z) { patch.warzone = +z; const f = factionOfZone(z); if (f) patch.faction = f; }
  patch.inactive = $('#aInactive').value === '1';
  patch.notes = ($('#aNotes').value || '').trim();
  guard(async () => { await upsertAlliance(tag, patch); }, 'Saved [' + tag + ']');
}
async function bulkUpdate(){
  const txt = $('#bulk').value || ''; const msg = $('#bulkMsg');
  const lines = txt.split(/\n+/).map(l => l.trim()).filter(Boolean);
  const parsed = [];
  for (const l of lines) {
    const tm = l.match(/\[([^\]]{1,12})\]/); if (!tm) continue;
    const tag = tm[1].trim();
    const zm = l.match(/#\s?(\d{4})/);
    const pm = l.match(/Power:?\s*([\d.]+)\s*([GM])/i);
    let rest = l.replace(tm[0], ' ').replace(/#\s?\d{4}/, ' ').replace(/Power:?\s*[\d.]+\s*[GM]/i, ' ');
    const nums = (rest.match(/\d[\d,]*(?:\.\d+)?\s*[KkMm]?\b/g) || []).map(parseCu).filter(n => isFinite(n) && n >= 1000);
    const cu = nums.length ? Math.max(...nums) : null;
    parsed.push({ tag, cu, zone: zm ? +zm[1] : null, power: pm ? (/m/i.test(pm[2]) ? parseFloat(pm[1]) / 1000 : parseFloat(pm[1])) : null });
  }
  if (!parsed.length) { msg.textContent = 'No lines with a [TAG] found.'; return; }
  let ok = 0, skip = [];
  await guard(async () => {
    for (const p of parsed) {
      const patch = {};
      if (p.cu != null) patch.copper = p.cu;
      if (p.power != null) patch.power = p.power;
      if (p.zone) { patch.warzone = p.zone; const f = factionOfZone(p.zone); if (f) patch.faction = f; }
      const exists = S.alliances.some(a => a.tag === p.tag);
      if (!exists && !patch.faction) { skip.push(p.tag); continue; }
      if (!Object.keys(patch).length) continue;
      await upsertAlliance(p.tag, patch); ok++;
    }
  });
  msg.textContent = 'Updated ' + ok + ' alliance' + (ok === 1 ? '' : 's') + (skip.length ? '. Skipped (no warzone, not on file): ' + skip.join(', ') : '.');
}
function saveSettings(){
  const c = Object.assign({}, S.cfg || {});
  c.us = ($('#sUs').value || 'QIET').trim().replace(/^\[|\]$/g, '');
  c.plunderPct = (+$('#sPl').value || 15) / 100;
  c.winTake = (+$('#sWt').value || 93) / 100;
  c.lossTake = (+$('#sLt').value || 0) / 100;
  c.assistProb = Math.max(0, Math.min(1, (+$('#sAp').value || 0) / 100));
  c.lockMode = $('#sLock').value;
  c.serverUtcOffset = +$('#sOff').value || 0;
  const rate = parseCu($('#sRate').value); c.knownRates = Object.assign({}, (S.cfg && S.cfg.knownRates) || {}); if (isFinite(rate) && rate > 0) c.knownRates[c.us] = rate;
  guard(() => S.db.doc('config/main').set(c), 'Settings saved');
}
function saveFix(round, attacker, target){
  const id = 'r' + round;
  const cur = S.plans[id] || { round, fixed: {} };
  const fixed = Object.assign({}, cur.fixed || {});
  if (target) fixed[attacker] = target; else delete fixed[attacker];
  guard(() => S.db.doc('plans/' + id).set({ round, fixed, updatedAt: new Date().toISOString() }), target ? 'Locked ' + attacker + ' → ' + (target === 'none' ? 'no declaration' : target) : 'Back to model guess');
}
function exportJSON(){
  const data = JSON.stringify({ exportedAt: new Date().toISOString(), config: S.cfg, alliances: S.alliances, battles: S.battles, plans: S.plans }, null, 1);
  const box = $('#exportBox');
  const fallback = () => { box.hidden = false; box.value = data; box.focus(); box.select(); toast('Select all and copy'); };
  try { navigator.clipboard.writeText(data).then(() => toast('Copied ' + Math.round(data.length / 1024) + ' KB of JSON'), fallback); } catch (e) { fallback(); }
}

/* ---------- boot ---------- */
let rt = null;
function schedule(){ clearTimeout(rt); rt = setTimeout(() => { recompute(); render(); }, 60); }
render();
setInterval(() => { if (M) renderTop(); }, 60000);
(async function boot(){
  if (!window.claude || !window.claude.use) { S.dbState = 'none'; S.got = { al: true, b: true, cfg: true }; render(); return; }
  const db = await window.claude.use('db');
  if (!db) { S.dbState = 'none'; S.got = { al: true, b: true, cfg: true }; render(); return; }
  S.db = db; S.dbState = 'ok';
  const user = await window.claude.use('user');
  try { const cw = user && user.can ? await user.can('data.write') : null; S.canWrite = cw !== false; } catch (e) { S.canWrite = true; }
  const onErr = e => { console.warn('db', e); };
  db.collection('alliances').onSnapshot(s => { S.alliances = s.docs.map(d => Object.assign({ tag: d.id }, d.data())); S.got.al = true; schedule(); }, onErr);
  db.collection('battles').onSnapshot(s => { S.battles = s.docs.map(d => Object.assign({ id: d.id }, d.data())); S.got.b = true; schedule(); }, onErr);
  db.doc('config/main').onSnapshot(s => { S.cfg = s.exists ? s.data() : null; S.got.cfg = true; schedule(); }, onErr);
  db.collection('plans').onSnapshot(s => { S.plans = {}; s.docs.forEach(d => { S.plans[d.id] = d.data(); }); schedule(); }, onErr);
})();
})();
</script>
</body></html>
